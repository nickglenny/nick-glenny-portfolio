<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Outreach Tracker | Nick Glenny</title>
<meta name="theme-color" content="#EFEAD8">
<link rel="icon" href="../favicon.ico">
<style>
@font-face{font-family:Decalotype;src:url('../site-files/fonts/Decalotype-Regular.otf');font-display:swap}
@font-face{font-family:Decalotype;src:url('../site-files/fonts/Decalotype-Italic.otf');font-style:italic;font-display:swap}
@font-face{font-family:Inter;src:url('../site-files/fonts/c5738de8-f098-492e-8a24-79e9b987da46.woff2');font-display:swap}
:root{--paper:#EFEAD8;--paper2:#E8E1CC;--ink:#1A1612;--muted:#6B6256;--orange:#C2410C;--hair:#1a161226;--ok:#2F6B3A;--warn:#9A6408;--bad:#A3271B;--display:Decalotype,Arial,sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--body)}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--hair)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:22px;gap:16px}
.brand{font-family:var(--display);font-size:24px;letter-spacing:-.5px;line-height:1}
.stamp{font-size:11px;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;letter-spacing:-1.5px;line-height:1.02;font-size:clamp(44px,7vw,76px);margin:0 0 14px}
h1 em{color:var(--orange)}
h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.5px;margin:0 0 14px}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:1.6px;color:var(--orange);text-transform:uppercase;margin:0 0 16px}
.lead{color:var(--muted);max-width:62ch;margin:0}
/* lock */
.lock{min-height:calc(100vh - 70px);display:flex;align-items:center}
.lock form{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.lock input{padding:13px 14px;border:1px solid var(--ink);border-radius:3px;background:#fff8;min-width:min(320px,100%)}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:13px 20px;cursor:pointer;font-weight:500}
.btn:hover{background:#3a332b}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1.4em}
/* dashboard */
.top{padding-block:42px 26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:34px}
.tile{border:1px solid var(--hair);border-radius:4px;padding:16px;background:#fff4;min-width:0}
.tile h3{margin:0 0 4px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.3px}
.big{font-family:var(--display);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--muted)}
.funnel{display:grid;gap:8px;margin-bottom:40px;max-width:820px}
.frow{display:grid;grid-template-columns:110px 1fr 54px;gap:12px;align-items:center;font-size:13px}
.bar{height:22px;background:var(--paper2);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--orange);border-radius:3px}
.fnum{font-variant-numeric:tabular-nums;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--hair);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border-top:1px solid var(--ink);margin-bottom:60px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:10px 10px;border-bottom:1px solid var(--hair)}
th{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
td.name{font-weight:500;white-space:nowrap}
td.why{min-width:260px;max-width:420px;color:var(--muted)}
td.msg{min-width:260px;max-width:420px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--hair);white-space:nowrap;font-size:12px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.sent{color:var(--orange);border-color:var(--orange)}
.foot{font-size:11px;color:var(--muted);padding-bottom:30px}
[hidden]{display:none!important}
@media(max-width:600px){.frow{grid-template-columns:86px 1fr 40px}.big{font-size:30px}}
</style>
</head>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const STATUS = {
  sent: ['Texted', 'sent'], drafted: ['Draft ready', ''], held: ['Stays with team / not yet', 'warn'],
  replied: ['Replied, with the team', 'ok'], returned: ['Came back in', 'ok'], converted: ['Bought', 'ok'],
  opted_out: ['Opted out', 'bad'], ended: ['Sequence ended', 'warn']
};
const fmt = (d) => {
  if (!d) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  return m ? `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]} ${+m[3]}, ${m[1]}` : d;
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const yes = (v) => v === true || v === 'true';

function render(data) {
  const rows = data.rows;
  const n = (f) => rows.filter((r) => yes(r[f])).length;
  const t = { reviewed: rows.length, qualified: n('qualified'), sent: n('sent'), replied: n('replied'), returned: n('returned'), converted: n('converted') };
  const pct = (a) => t.sent ? Math.round(a / t.sent * 100) + '%' : '—';
  document.getElementById('stamp').textContent = 'Updated ' + data.generated;
  document.getElementById('summary').textContent =
    `${t.reviewed} clients reviewed, ${t.qualified} qualified for Phase 1, ${t.sent} texted, ${t.replied} replied and ${t.returned} came back in.`;
  const tiles = [
    ['Reviewed', t.reviewed, 'Clients checked in Mindbody'], ['Qualified', t.qualified, 'The rest stay with the team'],
    ['Texted', t.sent, 'Got at least one text'], ['Reply rate', pct(t.replied), 'Of clients texted'],
    ['Came back in', pct(t.returned), 'Of clients texted'], ['Bought', t.converted, 'Pack, intro or membership']
  ];
  const tw = document.getElementById('tiles');
  tiles.forEach(([h, v, s]) => { const d = el('div', 'tile'); d.append(el('h3', '', h), el('div', 'big', String(v)), el('div', 'sub', s)); tw.append(d); });
  const fw = document.getElementById('funnel');
  [['Reviewed', t.reviewed], ['Qualified', t.qualified], ['Texted', t.sent], ['Replied', t.replied], ['Came back in', t.returned], ['Bought', t.converted]]
    .forEach(([label, v]) => {
      const r = el('div', 'frow'); const bar = el('div', 'bar'); const fill = el('span');
      fill.style.width = (t.reviewed ? Math.max(v / t.reviewed * 100, v ? 1 : 0) : 0) + '%'; bar.append(fill);
      r.append(el('span', '', label), bar, el('span', 'fnum', String(v))); fw.append(r);
    });
  const groups = [['All', () => true], ['Texted', (r) => r.status === 'sent'], ['Replied', (r) => yes(r.replied)],
    ['Draft ready', (r) => r.status === 'drafted'], ['Stays with team / not yet', (r) => r.status === 'held']];
  const fl = document.getElementById('filters'); let active = 0;
  const draw = () => {
    const body = document.getElementById('rows'); body.replaceChildren();
    const list = rows.filter(groups[active][1]).sort((a, b) =>
      (b.last_text || '').localeCompare(a.last_text || '') || (a.client || '').localeCompare(b.client || ''));
    for (const r of list) {
      const tr = body.insertRow(); const st = STATUS[r.status] || [r.status || '', ''];
      tr.append(el('td', 'name', r.client));
      const td = el('td'); td.append(el('span', 'pill ' + st[1], st[0])); tr.append(td);
      tr.append(el('td', '', fmt(r.last_visit)), el('td', '', String(r.texts_sent ?? 0)), el('td', '', fmt(r.last_text)),
        el('td', '', r.next_text || ''), el('td', 'why', r.reason || ''), el('td', 'msg', r.text || ''));
    }
    [...fl.children].forEach((c, i) => c.setAttribute('aria-pressed', String(i === active)));
  };
  groups.forEach(([label, fn], i) => {
    const c = el('button', 'chip', `${label} (${rows.filter(fn).length})`); c.type = 'button';
    c.onclick = () => { active = i; draw(); }; fl.append(c);
  });
  draw();
  document.getElementById('foot').textContent = 'Snapshot of the live tracker, republished after each outreach round. Data stays encrypted on the server.';
}

document.getElementById('unlock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const data = await decrypt(document.getElementById('pw').value);
    document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false;
    render(data);
  } catch { err.textContent = 'That password did not work.'; }
});
</script>
