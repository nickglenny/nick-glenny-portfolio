<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    /* Light palette — drives section chrome (hero, work, services, about, contact, footer) */
    --bg: #EAE6DC;          /* page background — Bone */
    --bg2: #F2EFE6;          /* surface 2 (services / cards) */
    --bg3: #DCD7C9;          /* surface 3 (stat tiles / inputs) */
    --ink: #0E0D0A;          /* primary text */
    --ink-dim: #5A554D;      /* secondary */
    --ink-soft: #6E6A60;     /* body copy on light */
    --ink-faint: #B8B3A6;    /* faint, hairlines */
    --hair: rgba(14,13,10,0.10);
    --hair-strong: rgba(14,13,10,0.22);
    --accent: #C2410C;       /* default accent — Burnt Orange */
    --accent-dim: rgba(194,65,12,0.12);
    --body-weight: 400;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --border: rgba(14,13,10,0.10);

    /* legacy aliases (kept so unmigrated rules still work) */
    --text: var(--ink);
    --muted: var(--ink-dim);
  }

  html { scroll-behavior: smooth; background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); overflow-x: hidden; }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;

// ─── WebGL Smoke ──────────────────────────────────────────────────────────────
const FRAG = `#version 300 es
precision highp float;
out vec4 O;
uniform float time;
uniform vec2 resolution;
uniform vec3 u_color;
uniform vec3 u_bg;
#define FC gl_FragCoord.xy

#define T (time+660.)

float fbm(vec2 p){float t=.0,a=1.;for(int i=0;i<5;i++){t+=a*noise(p);p*=mat2(1,-1.2,.2,1.2)*2.;a*=.5;}return t;}
void main(){
  vec2 uv=(FC-.5*R)/R.y;
  uv.x+=.25;
  uv*=vec2(2,1);
  float n=fbm(uv*.28-vec2(T*.01,0));
  n=noise(uv*3.+n*2.);
  // Build smoke density (0 = clear, 1 = densest)
  float density = (
    fbm(uv+vec2(0,T*.015)+n) +
    fbm(uv*1.003+vec2(0,T*.015)+n+.003) +
    fbm(uv*1.006+vec2(0,T*.015)+n+.006)
  ) / 3.;
  density = clamp(density, 0., 1.);
  // Base = light bg, smoke darkens slightly toward warm shadow tinted with accent
  vec3 shadow = mix(u_bg * 0.78, u_color, 0.18);
  vec3 col = mix(u_bg, shadow, density * 0.55);
  // Subtle accent kiss on the brightest highlights
  col = mix(col, u_color * 0.5 + col * 0.5, smoothstep(.55,.85,1.-density) * 0.06);
  // fade-in from bg
  col = mix(u_bg, col, min(time*.15, 1.));
  O = vec4(col, 1);
}`;

const VERT = `#version 300 es
precision highp float;
in vec4 position;
void main(){gl_Position=position;}`;

      gl.shaderSource(shader, src);
      gl.compileShader(shader);
    }

    const fs = gl.createShader(gl.FRAGMENT_SHADER);

    gl.attachShader(prog, vs);gl.attachShader(prog, fs);
    gl.linkProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 1, -1, -1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    const pos = gl.getAttribLocation(prog, 'position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'resolution');
    const uTime = gl.getUniformLocation(prog, 'time');
    const uColor = gl.getUniformLocation(prog, 'u_color');
    const uBg = gl.getUniformLocation(prog, 'u_bg');

    // Helper: read CSS hex/rgb token → [r,g,b] in 0..1
    const cssToRgb = (str) => {
      str = str.trim();
      if (str.startsWith('#')) {
        const h = str.slice(1);
        const n = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
        return [parseInt(n.slice(0,2),16)/255, parseInt(n.slice(2,4),16)/255, parseInt(n.slice(4,6),16)/255];

      if (m) { const p = m[1].split(',').map((v) => parseFloat(v)); return [p[0]/255, p[1]/255, p[2]/255]; }
      return [0.92, 0.90, 0.86];
    };
    const readBgVar = () => {
      const v = getComputedStyle(document.documentElement).getPropertyValue('--bg');
      return v ? cssToRgb(v) : [0.92, 0.90, 0.86];

    stateRef.current = { gl, prog, buf, uRes, uTime, uColor, uBg, color: [0.76, 0.25, 0.05], bg: readBgVar() };

    // Re-read bg on theme changes (poll lightly — palette swaps are rare)
    const bgPoll = setInterval(() => { stateRef.current.bg = readBgVar(); }, 600);

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio);
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener('resize', resize);

    let raf;
    function loop(now) {
      const s = stateRef.current;
      gl.clearColor(s.bg[0], s.bg[1], s.bg[2], 1);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(s.prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, s.buf);
      gl.uniform2f(s.uRes, canvas.width, canvas.height);
      gl.uniform1f(s.uTime, now * 1e-3);
      gl.uniform3fv(s.uColor, s.color);
      gl.uniform3fv(s.uBg, s.bg);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      clearInterval(bgPoll);
      window.removeEventListener('resize', resize);
      gl.deleteProgram(prog);
    };
  }, []);

  useEffect(() => {
    if (!color) return;
    const hex = color.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16) / 255;
    const g = parseInt(hex.slice(2, 4), 16) / 255;
    const b = parseInt(hex.slice(4, 6), 16) / 255;
    stateRef.current.color = [r, g, b];
  }, [color]);

  return <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block' }} />;
}

// ─── Intersection observer hook ───────────────────────────────────────────────
function useReveal(threshold = 0.1, startVisible = false) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(startVisible);
  useEffect(() => {
    if (startVisible) return;
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {setVisible(true);obs.disconnect();}
    }, { threshold, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, [startVisible]);
  return [ref, visible];
}

function AdLightbox({ children, onClose }) {
  useEffect(() => {
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 2000,
      background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(8px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{ position: 'relative', width: '100%', maxWidth: 480 }}>
        {children}
        <button onClick={onClose} style={{
          position: 'absolute', top: -44, right: 0,
          background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)',
          color: '#aaa', width: 36, height: 36, borderRadius: '50%',

}

// ─── Modal ────────────────────────────────────────────────────────────────────
function Modal({ project, onClose, accentColor }) {
  useEffect(() => {
    document.body.style.overflow = 'hidden';
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    window.addEventListener('keydown', handler);
    return () => {document.body.style.overflow = '';window.removeEventListener('keydown', handler);};
  }, []);

  const accent = accentColor;
  const isEmail = project.type === 'Email' || project.type === 'Email + SMS';
  const isSMS = project.type === 'SMS' || project.type === 'Email + SMS';

  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'rgba(14,13,10,0.42)', zIndex: 1000,
      overflowY: 'auto', backdropFilter: 'blur(6px)'
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        maxWidth: 900, margin: '60px auto', background: 'var(--bg)',
        border: '1px solid var(--hair)', borderRadius: 2,
        overflow: 'hidden',
        boxShadow: '0 30px 80px rgba(14,13,10,0.18), 0 4px 12px rgba(14,13,10,0.06)'

        {/* Header */}
        <div style={{ padding: '48px 56px 40px', borderBottom: '1px solid var(--hair)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent, marginBottom: 12, fontFamily: "'Inter',sans-serif", fontWeight: 500 }}>
                {project.tag}
              </div>
              <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(28px,4vw,44px)', fontWeight: 700, color: 'var(--ink)', lineHeight: 1.1 }}>
                {project.client}
              </h2>
            </div>
            <button onClick={onClose} style={{ background: 'none', border: '1px solid var(--hair)', color: 'var(--ink-dim)', width: 40, height: 40, borderRadius: 2, cursor: 'pointer', fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>×</button>

        </div>

        <div style={{ padding: '48px 56px' }}>
          {/* Metrics */}
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(${project.results.length},1fr)`, gap: 2, marginBottom: 48 }}>

                <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(28px,4vw,42px)', fontWeight: 900, color: accent, lineHeight: 1 }}>{r.val}</div>
                <div style={{ fontSize: 11, color: 'var(--ink-dim)', marginTop: 8, letterSpacing: '0.06em', textTransform: 'uppercase', fontFamily: "'Inter',sans-serif" }}>{r.label}</div>
              </div>
            )}
          </div>

          {/* Goal + Approach */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32, marginBottom: 48 }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 12, fontFamily: "'Inter',sans-serif" }}>The Goal</div>
              <p style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--ink)', fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)' }}>{project.goal}</p>
            </div>
            <div>
              <div style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 12, fontFamily: "'Inter',sans-serif" }}>The Approach</div>
              <p style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--ink)', fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)' }}>{project.approach}</p>
            </div>
          </div>

          {/* Creatives */}
          <div>

            {project.type === 'Meta Ads' ?
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(220px,1fr))', gap: 16 }}>
                {project.creatives.map((c, i) =>
              c.kind === 'photo' ?
              <PhotoAdMockup
                key={i}
                offerLabel={c.offerLabel}
                headline={c.headline}
                sub={c.sub}
                brand={project.client}
                cta={c.cta}

              <CarouselInfoPost
                key={i}
                slideNum={c.slideNum}
                totalSlides={c.totalSlides}
                title={c.title}
                items={c.items}
                brand={project.client}

              )}

            <div style={{ display: 'grid', gridTemplateColumns: isSMS ? '1fr 1fr' : 'repeat(auto-fill,minmax(200px,1fr))', gap: 12 }}>

                  </div> :
              isEmail ?
              <div key={i} style={{ background: 'var(--bg2)', border: '1px solid var(--hair)', borderRadius: 2, padding: '20px' }}>
                    <div style={{ fontSize: 9, color: 'var(--ink-dim)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 12, fontFamily: "'Inter',sans-serif" }}>{c.type}</div>
                    <div style={{ borderLeft: `2px solid ${accent}`, paddingLeft: 14 }}>
                      <div style={{ fontSize: 10, color: 'var(--ink-dim)', marginBottom: 6, fontFamily: "'Inter',sans-serif" }}>Subject line</div>
                      <p style={{ fontSize: 13, color: 'var(--ink)', lineHeight: 1.5, fontFamily: "'Inter',sans-serif", fontWeight: 500 }}>{c.headline}</p>
                    </div>
                    <p style={{ fontSize: 11, color: 'var(--ink-soft)', marginTop: 10, fontFamily: "'Inter',sans-serif" }}>{c.sub}</p>
                  </div> :
              <div key={i} style={{ background: 'var(--bg2)', border: '1px solid var(--hair)', borderRadius: 2, overflow: 'hidden' }}>
                    <div style={{ height: 120, background: `linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 100%)`, display: 'flex', alignItems: 'flex-end', padding: '16px', borderBottom: `1px solid var(--hair)` }}>
                      <p style={{ fontSize: 14, fontFamily: "'Playfair Display',serif", fontWeight: 700, color: 'var(--ink)', lineHeight: 1.3 }}>{c.headline}</p>
                    </div>
                    <div style={{ padding: '12px 16px 14px' }}>

                      <p style={{ fontSize: 11, color: 'var(--ink-soft)', lineHeight: 1.5, fontFamily: "'Inter',sans-serif" }}>{c.sub}</p>
                    </div>
                  </div>
              )}
              </div>
            }
          </div>
        </div>
      </div>
    </div>);

}

// ─── Tile Preview (mini ad creative shown in the work grid) ──────────────────
function TilePreview({ project, accent, hovered, height }) {
  const isMeta = project.type === 'Meta Ads';
  const isEmail = project.type === 'Email';
  const isSMS = project.type === 'SMS';
  const isHybrid = project.type === 'Email + SMS';

  // Meta: real gym photo + offer chip + headline overlay
  if (isMeta) {
    const photoCreative = project.creatives.find((c) => c.kind === 'photo') || project.creatives[0];
    const photo = GYM_PHOTOS[(photoCreative.photoIndex || 0) % GYM_PHOTOS.length];
    return (
      <div style={{ position: 'absolute', inset: 0, background: '#0E0D0A' }}>
        <img src={photo} alt="" style={{
          width: '100%', height: '100%', objectFit: 'cover', display: 'block',
          filter: hovered ? 'brightness(0.62) saturate(1.1)' : 'brightness(0.55) saturate(1)',
          transform: hovered ? 'scale(1.04)' : 'scale(1)',
          transition: 'transform 0.6s ease, filter 0.4s'
        }} />
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(14,13,10,0.15) 0%, rgba(14,13,10,0.05) 40%, rgba(14,13,10,0.85) 100%)' }} />
        {/* Offer chip top-left */}
        <div style={{ position: 'absolute', top: 16, left: 16, background: accent, color: '#fff', fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', fontFamily: "'Inter',sans-serif", fontWeight: 700, padding: '6px 10px', borderRadius: 2 }}>
          {photoCreative.offerLabel || 'Sponsored'}
        </div>
        {/* Headline bottom */}
        <div style={{ position: 'absolute', bottom: 16, left: 18, right: 18 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent, fontFamily: "'Inter',sans-serif", fontWeight: 600, marginBottom: 6 }}>
            {project.tag}
          </div>
          <p style={{ fontFamily: "'Playfair Display',serif", fontSize: height >= 200 ? 22 : 16, fontWeight: 700, color: '#FAF7EE', lineHeight: 1.2, letterSpacing: '-0.01em', textShadow: '0 1px 12px rgba(0,0,0,0.4)' }}>
            {photoCreative.headline}
          </p>
        </div>
      </div>);

  }

  // Email: stack of subject lines (inbox preview)
  if (isEmail) {
    const items = project.creatives.slice(0, height >= 200 ? 4 : 3);
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'var(--bg2)', padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 10, justifyContent: 'center' }}>
        <div style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent, fontFamily: "'Inter',sans-serif", fontWeight: 600, marginBottom: 4 }}>
          {project.tag}
        </div>
        {items.map((c, i) =>
        <div key={i} style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '8px 10px',
          background: i === 0 ? 'var(--bg)' : 'transparent',
          borderLeft: i === 0 ? `2px solid ${accent}` : '2px solid transparent',
          borderRadius: 2,
          transition: 'background 0.3s'
        }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: i === 0 ? accent : 'var(--ink-dim)', flexShrink: 0 }} />
            <p style={{
            fontSize: 12, color: 'var(--ink)',
            fontFamily: "'Inter',sans-serif", fontWeight: i === 0 ? 600 : 400,
            lineHeight: 1.3,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            flex: 1
          }}>
              {c.headline}
            </p>
            <span style={{ fontSize: 9, color: 'var(--ink-dim)', fontFamily: "'Inter',sans-serif", letterSpacing: '0.06em', flexShrink: 0 }}>
              {c.type.replace('Email', 'E').replace(/[^A-Z0-9]/gi, '').slice(0, 3) || (i + 1)}
            </span>
          </div>
        )}
      </div>);

  }

  // SMS: chat bubble preview
  if (isSMS) {
    const msg = project.creatives[1] || project.creatives[0];
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'var(--bg2)', padding: '20px 22px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 8 }}>
        <div style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent, fontFamily: "'Inter',sans-serif", fontWeight: 600, marginBottom: 4 }}>
          {project.tag}
        </div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8 }}>
          <div style={{ width: 24, height: 24, borderRadius: '50%', background: accent + '22', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: accent, fontFamily: "'Inter',sans-serif", fontWeight: 700 }}>
            {project.client[0]}
          </div>
          <div style={{ background: 'var(--bg)', border: '1px solid var(--hair)', borderRadius: '14px 14px 14px 4px', padding: '10px 14px', maxWidth: '85%' }}>
            <p style={{ fontSize: 12.5, color: 'var(--ink)', lineHeight: 1.45, fontFamily: "'Inter',sans-serif", fontWeight: 400 }}>
              {msg.headline}
            </p>
          </div>
        </div>
        {height >= 200 &&
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8, justifyContent: 'flex-end' }}>
            <div style={{ background: accent, color: '#fff', borderRadius: '14px 14px 4px 14px', padding: '8px 12px', maxWidth: '70%' }}>
              <p style={{ fontSize: 12, lineHeight: 1.4, fontFamily: "'Inter',sans-serif", fontWeight: 500 }}>Yes — I'd love to come back.</p>
            </div>
          </div>
        }
        <div style={{ fontSize: 9, color: 'var(--ink-dim)', fontFamily: "'Inter',sans-serif", letterSpacing: '0.06em', marginTop: 2 }}>iMessage · {msg.type}</div>
      </div>);

  }

  // Hybrid (Email + SMS): split panel — email subject + SMS bubble
  if (isHybrid) {
    const emailMsg = project.creatives.find((c) => c.type && c.type.startsWith('Email')) || project.creatives[0];
    const smsMsg = project.creatives.find((c) => c.type && c.type.startsWith('SMS')) || project.creatives[project.creatives.length - 1];
    return (
      <div style={{ position: 'absolute', inset: 0, background: 'var(--bg2)', display: 'grid', gridTemplateColumns: '1fr 1fr' }}>
        {/* Email side */}
        <div style={{ padding: '18px 18px', borderRight: '1px solid var(--hair)', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 6 }}>
          <div style={{ fontSize: 9, color: 'var(--ink-dim)', letterSpacing: '0.14em', textTransform: 'uppercase', fontFamily: "'Inter',sans-serif" }}>Email</div>
          <div style={{ borderLeft: `2px solid ${accent}`, paddingLeft: 10 }}>
            <p style={{ fontSize: 12, color: 'var(--ink)', fontFamily: "'Inter',sans-serif", fontWeight: 600, lineHeight: 1.35 }}>
              {emailMsg.headline}
            </p>
          </div>
        </div>
        {/* SMS side */}
        <div style={{ padding: '18px 18px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 6 }}>
          <div style={{ fontSize: 9, color: 'var(--ink-dim)', letterSpacing: '0.14em', textTransform: 'uppercase', fontFamily: "'Inter',sans-serif" }}>SMS</div>
          <div style={{ background: 'var(--bg)', border: '1px solid var(--hair)', borderRadius: '12px 12px 12px 3px', padding: '8px 12px' }}>
            <p style={{ fontSize: 11.5, color: 'var(--ink)', lineHeight: 1.4, fontFamily: "'Inter',sans-serif" }}>
              {smsMsg.headline}
            </p>
          </div>
        </div>
        <div style={{ position: 'absolute', top: 14, left: 18, fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent, fontFamily: "'Inter',sans-serif", fontWeight: 600 }}>
          {project.tag}
        </div>
      </div>);

  }

  return null;
}

// ─── Project Tile ─────────────────────────────────────────────────────────────
function ProjectTile({ project, onClick, accentColor, compact }) {
  const [hovered, setHovered] = useState(false);
  const [ref, visible] = useReveal(0.1);
  const accent = accentColor;

  const tileStyle = {
    background: hovered ? 'var(--bg3)' : 'var(--bg2)',
    border: `1px solid ${hovered ? 'var(--hair-strong)' : 'var(--hair)'}`,
    borderRadius: 2,
    cursor: 'pointer',
    overflow: 'hidden',
    transition: 'background 0.3s, border-color 0.3s, transform 0.3s, opacity 0.6s',
    transform: visible ? hovered ? 'translateY(-3px)' : 'translateY(0)' : 'translateY(24px)',
    opacity: visible ? 1 : 0,
    gridColumn: project.size === 'large' ? 'span 2' : 'span 1'
  };

  return (
    <div ref={ref} style={tileStyle} onClick={() => onClick(project)}
    onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}>
      {/* Image area — real ad creative preview */}
      <div style={{ height: compact ? 140 : project.size === 'large' ? 260 : 190, background: 'var(--bg3)', position: 'relative', overflow: 'hidden', borderBottom: '1px solid var(--hair)' }}>
        <TilePreview project={project} accent={accent} hovered={hovered} height={compact ? 140 : project.size === 'large' ? 260 : 190} />
        {/* Hover accent wash */}
        <div style={{ position: 'absolute', inset: 0, background: `${accent}10`, opacity: hovered ? 1 : 0, transition: 'opacity 0.3s', pointerEvents: 'none' }} />
      </div>

      {/* Content */}
      <div style={{ padding: '24px 24px 28px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16 }}>
          <div style={{ flex: 1 }}>
            <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(16px,2vw,20px)', fontWeight: 700, color: 'var(--ink)', lineHeight: 1.2, marginBottom: 8 }}>
              {project.client}
            </h3>
            <p style={{ fontSize: 12, color: 'var(--ink-dim)', fontFamily: "'Inter',sans-serif", letterSpacing: '0.04em' }}>

          </div>
          <div style={{ textAlign: 'right', flexShrink: 0 }}>
            <div style={{ fontFamily: "'Playfair Display',serif", fontSize: compact ? 28 : 36, fontWeight: 900, color: accent, lineHeight: 1 }}>
              {project.metric}
            </div>
            <div style={{ fontSize: 10, color: 'var(--ink-dim)', marginTop: 4, fontFamily: "'Inter',sans-serif", letterSpacing: '0.06em', textTransform: 'uppercase' }}>
              {project.metricLabel}
            </div>
          </div>
        </div>
        <div style={{ marginTop: 20, display: 'flex', alignItems: 'center', gap: 6, color: hovered ? accent : 'var(--ink-dim)', fontSize: 11, fontFamily: "'Inter',sans-serif", letterSpacing: '0.08em', textTransform: 'uppercase', transition: 'color 0.2s' }}>
          View case study <span style={{ fontSize: 14 }}>→</span>
        </div>
      </div>
    </div>);

}

// ─── Generic mockup feed (swipeable container) ────────────────────────────────
function MockupFeed({ items, renderItem, accent }) {
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);

  const onScroll = () => {
    if (!scrollRef.current) return;
    const w = scrollRef.current.clientWidth;
    const idx = Math.round(scrollRef.current.scrollLeft / w);
    if (idx !== activeIdx) setActiveIdx(idx);
  };

  const goto = (i) => {
    if (!scrollRef.current) return;
    scrollRef.current.scrollTo({ left: i * scrollRef.current.clientWidth, behavior: 'smooth' });
  };

  return (
    <div>
      <div style={{
        position: 'relative',
        background: '#fff',
        borderRadius: 6,
        overflow: 'hidden',
        boxShadow: '0 30px 80px rgba(14,13,10,0.18), 0 4px 12px rgba(14,13,10,0.06)'
      }}>
        <div ref={scrollRef} onScroll={onScroll} className="ig-feed-scroll" style={{
          display: 'flex',
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          WebkitOverflowScrolling: 'touch'
        }}>
          {items.map((item, i) => renderItem(item, i, items.length))}
        </div>
      </div>

      {/* Pagination */}
      <div style={{
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: 8, marginTop: 18,
        fontFamily: "'Inter',sans-serif"
      }}>
        <button onClick={() => goto(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === 0 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === 0 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === 0 ? 0.4 : 1
        }}>‹</button>
        <div style={{ display: 'flex', gap: 6 }}>
          {items.map((_, i) =>
            <button key={i} onClick={() => goto(i)} style={{
              width: 7, height: 7, borderRadius: '50%',
              background: i === activeIdx ? accent : 'var(--hair-strong, rgba(0,0,0,0.2))',
              border: 'none', padding: 0, cursor: 'pointer',
              transition: 'background 0.2s, transform 0.2s',
              transform: i === activeIdx ? 'scale(1.2)' : 'scale(1)'
            }} />
          )}
        </div>
        <button onClick={() => goto(Math.min(items.length - 1, activeIdx + 1))} disabled={activeIdx === items.length - 1} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === items.length - 1 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === items.length - 1 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === items.length - 1 ? 0.4 : 1
        }}>›</button>
        <div style={{ marginLeft: 8, fontSize: 11, color: 'var(--ink-dim)', letterSpacing: '0.08em', fontFamily: "'Inter',sans-serif" }}>
          {String(activeIdx + 1).padStart(2, '0')} / {String(items.length).padStart(2, '0')}
        </div>
      </div>
    </div>);

}

function App() {
  const [modal, setModal] = useState(null);
  const [accent, setAccent] = useState('#C2410C');
  const [smokeEnabled, setSmokeEnabled] = useState(true);
  const [compact, setCompact] = useState(false);
  const [contactEmail, setContactEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const [heroRef, heroVisible] = useReveal(0, true);
  const [aboutRef, aboutVisible] = useReveal(0.1);
  const [contactRef, contactVisible] = useReveal(0.1);

  // Tweaks panel wiring
  useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    if (!panel) return;

    // Each bg name → [page, surface2, surface3] tuple. Same hue family, stepped lightness.
    const BG_PALETTES = {
      bone: ['#EAE6DC', '#F2EFE6', '#DCD7C9'],
      cream: ['#F1E9D2', '#F8F2E0', '#E4DAC0'],
      paper: ['#F4F0E6', '#FAF7EE', '#E6E0D2'],
      stone: ['#D6D2C5', '#DEDBCF', '#C7C2B3'],
      sand: ['#E2D6BE', '#EBE1CC', '#D2C5A8'],
      mist: ['#E0E2DD', '#E9EBE6', '#D0D2CC'],
      pearl: ['#EFEDE6', '#F6F4ED', '#E1DED5'],
      ash: ['#CFCEC8', '#D8D7D1', '#BFBEB7'],
      linen: ['#ECE5D6', '#F4EEE0', '#DDD4C0'],
      ivory: ['#F8F2E1', '#FCF7EA', '#EDE3CB']
    };

    const root = document.documentElement.style;

    const applyBg = (name) => {
      const p = BG_PALETTES[name] || BG_PALETTES.bone;
      root.setProperty('--bg', p[0]);
      root.setProperty('--bg2', p[1]);
      root.setProperty('--bg3', p[2]);
    };
    const applyWeight = (w) => root.setProperty('--body-weight', String(w));
    const applyContrast = (mode) => {
      if (mode === 'high') {
        root.setProperty('--ink', '#000');
        root.setProperty('--ink-dim', '#3A352D');
        root.setProperty('--ink-soft', '#4A453B');
        root.setProperty('--hair', 'rgba(0,0,0,0.18)');
        root.setProperty('--hair-strong', 'rgba(0,0,0,0.32)');
      } else {
        root.setProperty('--ink', '#0E0D0A');
        root.setProperty('--ink-dim', '#5A554D');
        root.setProperty('--ink-soft', '#6E6A60');
        root.setProperty('--hair', 'rgba(14,13,10,0.10)');
        root.setProperty('--hair-strong', 'rgba(14,13,10,0.22)');
      }
    };
    const applyAccent = (c) => {
      root.setProperty('--accent', c);
      // recompute accent-dim as 12% alpha of the hex
      const r = parseInt(c.slice(1, 3), 16),g = parseInt(c.slice(3, 5), 16),b = parseInt(c.slice(5, 7), 16);
      root.setProperty('--accent-dim', `rgba(${r},${g},${b},0.12)`);
      setAccent(c);
    };

    // ── Edit-mode protocol ──
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('visible');
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // ── Close button ──
    const closeBtn = document.getElementById('panel-close');
    if (closeBtn) closeBtn.addEventListener('click', () => {
      panel.classList.remove('visible');
      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
    });

    // ── Background swatches ──
    panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((s) => {
      s.addEventListener('click', () => {
        panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((x) => x.classList.remove('active'));
        s.classList.add('active');
        const name = s.dataset.bg;
        applyBg(name);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { background: name } }, '*');
      });
    });

    // ── Body weight segmented ──
    panel.querySelectorAll('#weight-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        panel.querySelectorAll('#weight-seg button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        const w = b.dataset.weight;
        applyWeight(w);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { bodyWeight: Number(w) } }, '*');
      });
    });

    // ── Contrast segmented ──
    panel.querySelectorAll('#contrast-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        panel.querySelectorAll('#contrast-seg button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        const mode = b.dataset.contrast;
        applyContrast(mode);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { contrast: mode } }, '*');
      });
    });

    // ── Accent pills ──
    panel.querySelectorAll('#accent-list .accent-pill').forEach((p) => {
      p.addEventListener('click', () => {
        panel.querySelectorAll('#accent-list .accent-pill').forEach((x) => x.classList.remove('active'));
        p.classList.add('active');
        const c = p.dataset.color;
        const name = p.dataset.accent;
        applyAccent(c);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: name } }, '*');
      });
    });

    // ── Apply initial values from TWEAK_DEFAULTS ──
    const t = typeof TWEAK_DEFAULTS !== 'undefined' ? TWEAK_DEFAULTS : {};
    if (t.background) {
      applyBg(t.background);
      const sw = panel.querySelector(`#bg-swatches .bg-swatch[data-bg="${t.background}"]`);
      if (sw) {panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((x) => x.classList.remove('active'));sw.classList.add('active');}
    }
    if (t.bodyWeight) {
      applyWeight(t.bodyWeight);
      const wb = panel.querySelector(`#weight-seg button[data-weight="${t.bodyWeight}"]`);
      if (wb) {panel.querySelectorAll('#weight-seg button').forEach((x) => x.classList.remove('on'));wb.classList.add('on');}
    }
    if (t.contrast) {
      applyContrast(t.contrast);
      const cb = panel.querySelector(`#contrast-seg button[data-contrast="${t.contrast}"]`);
      if (cb) {panel.querySelectorAll('#contrast-seg button').forEach((x) => x.classList.remove('on'));cb.classList.add('on');}
    }
    if (t.accent) {
      const pill = panel.querySelector(`#accent-list .accent-pill[data-accent="${t.accent}"]`);
      if (pill) {
        applyAccent(pill.dataset.color);
        panel.querySelectorAll('#accent-list .accent-pill').forEach((x) => x.classList.remove('active'));
        pill.classList.add('active');
      }
    }

    return () => window.removeEventListener('message', onMsg);
  }, []);

  return (
    <>
      <Nav accent={accent} />
      {modal && <Modal project={modal} onClose={() => setModal(null)} accentColor={accent} />}

      {/* ── HERO ── */}
      <section style={{ position: 'relative', height: '100vh', minHeight: 600, overflow: 'hidden', display: 'flex', alignItems: 'center' }}>
        {/* Smoke / gradient bg */}
        <div style={{ position: 'absolute', inset: 0, zIndex: 0 }}>
          {smokeEnabled ?
          <SmokeCanvas color={accent} /> :

          <div style={{ width: '100%', height: '100%', background: 'linear-gradient(160deg, var(--bg2) 0%, var(--bg3) 60%)' }} />
          }
        </div>
        {/* Overlay */}
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(234,230,220,0.35) 70%, var(--bg) 100%)', zIndex: 1 }} />

        {/* Content */}
        <div ref={heroRef} style={{
          position: 'relative', zIndex: 2, padding: '0 8vw',
          transition: 'opacity 1.2s, transform 1.2s',
          opacity: heroVisible ? 1 : 0,
          transform: heroVisible ? 'translateY(0)' : 'translateY(40px)'
        }}>
          <div style={{ fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase', color: accent, marginBottom: 24, fontFamily: "'Inter',sans-serif", fontWeight: 500 }}>
            Marketing for owner-operated fitness studios
          </div>
          <h1 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(38px,6vw,88px)', fontWeight: 900, color: 'var(--ink)', lineHeight: 1.05, maxWidth: '14em', marginBottom: 24, letterSpacing: '-0.02em' }}>
            Fill your studio's classes<br /><em style={{ color: accent, fontStyle: 'italic' }}>without dropping your intro price.</em>
          </h1>
          <p style={{ fontSize: 'clamp(14px,1.4vw,18px)', color: 'var(--ink-dim)', maxWidth: 480, lineHeight: 1.7, marginBottom: 44, fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)' }}>
            I run the ads, the SMS follow-up, and the after-hours AI phone agent that turn inquiries into booked classes — so you don't have to.
          </p>
          <a href="#contact" style={{
            display: 'inline-flex', alignItems: 'center', gap: 10,
            padding: '14px 32px', border: `1px solid ${accent}`,
            color: accent, textDecoration: 'none', fontSize: 12,
            letterSpacing: '0.12em', textTransform: 'uppercase',
            fontFamily: "'Inter',sans-serif", fontWeight: 500,
            transition: 'background 0.2s, color 0.2s',
            borderRadius: 1
          }}
          onMouseEnter={(e) => {e.currentTarget.style.background = accent;e.currentTarget.style.color = '#000';}}
          onMouseLeave={(e) => {e.currentTarget.style.background = 'transparent';e.currentTarget.style.color = accent;}}>
            Book a 15-min strategy call <span>→</span>
          </a>
        </div>

        {/* Scroll indicator */}
        <div style={{ position: 'absolute', bottom: 32, left: '50%', transform: 'translateX(-50%)', zIndex: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 1, height: 48, background: `linear-gradient(to bottom, transparent, ${accent})`, animation: 'scrollpulse 2s ease-in-out infinite' }} />
        </div>
      </section>

      {/* ── WORK ── */}
      <section id="work" style={{ padding: '100px 8vw', background: 'var(--bg)' }}>
        <div style={{ marginBottom: 64 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 16, fontFamily: "'Inter',sans-serif" }}>Selected Work</div>
          <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(28px,4vw,52px)', fontWeight: 700, color: 'var(--ink)', letterSpacing: '-0.02em' }}>Content that drives results.
</h2>
          <p style={{ fontSize: 13, color: "var(--ink-dim)", marginTop: 12, fontFamily: "'Inter',sans-serif", fontStyle: "italic" }}>Spec campaigns — built to demonstrate the system end-to-end.</p>
        </div>
      </section>

      {/* ── Case study panels (long-scroll) ── */}
      <CaseStudyPanel project={PROJECTS[0]} accent={accent} index={0} side="image-left" />
      <CaseStudyPanel project={PROJECTS[2]} accent={accent} index={1} side="image-right" />

      {/* ── SERVICES ── */}
      <section id="services" style={{ padding: '100px 8vw', background: 'var(--bg2)', borderTop: '1px solid var(--hair)' }}>
        <div style={{ marginBottom: 64 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 16, fontFamily: "'Inter',sans-serif" }}>Services</div>
          <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(28px,4vw,52px)', fontWeight: 700, color: 'var(--ink)', letterSpacing: '-0.02em' }}>The whole funnel, one operator.</h2>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 }}>
          {SERVICES.map((s, i) => {
            const [hov, setHov] = useState(false);
            const [ref, vis] = useReveal(0.1);
            const inverted = i === 1; // middle card flipped — dark on light row
            const cardBg = inverted ? '#0E0D0A' : '#FFFFFF';
            const titleColor = inverted ? '#FAF7EE' : 'var(--ink)';
            const bodyColor = inverted ? 'rgba(250,247,238,0.72)' : 'var(--ink-soft)';
            const iconColor = inverted ? (hov ? accent : 'rgba(250,247,238,0.55)') : (hov ? accent : 'var(--ink-dim)');
            const borderColor = inverted ? (hov ? accent + '60' : 'rgba(250,247,238,0.08)') : (hov ? accent + '60' : 'var(--hair)');
            return (
              <div key={i} ref={ref} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{
                  background: cardBg,
                  border: `1px solid ${borderColor}`,
                  borderRadius: 2,
                  padding: '40px 36px',
                  transition: 'background 0.3s, border-color 0.3s, transform 0.4s, opacity 0.6s',
                  transform: vis ? hov ? 'translateY(-4px)' : 'translateY(0)' : 'translateY(20px)',
                  opacity: vis ? 1 : 0,
                  cursor: 'default',
                  boxShadow: inverted ? '0 1px 2px rgba(14,13,10,0.04), 0 18px 48px rgba(14,13,10,0.18)' : '0 1px 2px rgba(14,13,10,0.04), 0 12px 30px rgba(14,13,10,0.06)'
                }}>
                <div style={{ fontSize: 28, marginBottom: 24, color: iconColor, transition: 'color 0.3s' }}>{s.icon}</div>
                <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 22, fontWeight: 700, color: titleColor, marginBottom: 16, letterSpacing: '-0.01em' }}>{s.title}</h3>
                <p style={{ fontSize: 14, color: bodyColor, lineHeight: 1.7, fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)' }}>{s.desc}</p>
              </div>);

          })}
        </div>
      </section>

      {/* ── ABOUT ── */}
      <section id="about" style={{ padding: '100px 8vw', background: 'var(--bg2)', borderTop: '1px solid var(--hair)' }}>
        <div ref={aboutRef} style={{
          display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '80px', alignItems: 'center',
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: aboutVisible ? 1 : 0,
          transform: aboutVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 20, fontFamily: "'Inter',sans-serif" }}>About</div>
            <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(24px,3vw,42px)', fontWeight: 700, color: 'var(--ink)', lineHeight: 1.15, marginBottom: 28, letterSpacing: '-0.02em' }}>
              I sold the memberships. I ran the floor.<br /><em style={{ color: accent }}>Now I run the marketing.</em>
            </h2>
            <p style={{ fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.85, fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)', maxWidth: 480 }}>
              I've worked in all kinds of fitness studios — running sales, managing social, handling member relations. So when I write the ad, the email, or the phone script, I'm using language your members already use.
            </p>
            <div style={{ marginTop: 40, display: 'flex', gap: 40 }}>
              {[['6+', 'Years inside fitness studios'], ['20+', "Studios I've worked with"], ['$1M+', "Revenue I've helped drive"]].map(([v, l]) =>
              <div key={l}>
                  <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 28, fontWeight: 900, color: accent }}>{v}</div>
                  <div style={{ fontSize: 11, color: 'var(--ink-dim)', marginTop: 4, fontFamily: "'Inter',sans-serif", letterSpacing: '0.06em', textTransform: 'uppercase' }}>{l}</div>
                </div>
              )}
            </div>
          </div>
          {/* Portrait */}
          <div style={{ aspectRatio: '4/5', background: 'var(--bg3)', borderRadius: 2, position: 'relative', overflow: 'hidden', maxWidth: 400, boxShadow: '0 18px 48px rgba(14,13,10,0.18), 0 2px 6px rgba(14,13,10,0.06)' }}>
            <img src={(window.__resources && window.__resources.portrait) || 'assets/nick-portrait.png'} alt="Nick Glenny portrait" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
          </div>
        </div>
      </section>

      {/* ── CONTACT ── */}
      <section id="contact" style={{ padding: '120px 8vw', background: 'var(--bg)', borderTop: '1px solid var(--hair)' }}>
        <div ref={contactRef} style={{
          maxWidth: 640,
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: contactVisible ? 1 : 0,
          transform: contactVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 20, fontFamily: "'Inter',sans-serif" }}>Contact</div>
          <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 'clamp(32px,5vw,64px)', fontWeight: 900, color: 'var(--ink)', lineHeight: 1.05, marginBottom: 20, letterSpacing: '-0.02em' }}>
            Ready to fill<br />your classes?
          </h2>
          <p style={{ fontSize: 16, color: 'var(--ink-dim)', marginBottom: 48, fontFamily: "'Inter',sans-serif", fontWeight: 'var(--body-weight)', lineHeight: 1.6 }}>
            Drop your email. I'll come back inside 24 hours with two specific things I'd test on your studio's funnel — no pitch deck, no "discovery call" runaround.
          </p>

          {submitted ?
          <div style={{ padding: '32px', border: `1px solid ${accent}55`, background: 'var(--bg2)', borderRadius: 2, textAlign: 'center' }}>
              <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 24, color: accent, marginBottom: 10 }}>Got it.</div>
              <p style={{ fontSize: 14, color: 'var(--ink-dim)', fontFamily: "'Inter',sans-serif" }}>I'll be in touch within 24 hours.</p>
            </div> :

          <div style={{ display: 'flex', gap: 0 }}>
              <input
              type="email"
              placeholder="your@email.com"
              value={contactEmail}
              onChange={(e) => setContactEmail(e.target.value)}
              style={{
                flex: 1, padding: '16px 20px', background: 'var(--bg2)',
                border: `1px solid var(--hair)`, borderRight: 'none',
                color: 'var(--ink)', fontSize: 14, fontFamily: "'Inter',sans-serif",
                outline: 'none', borderRadius: 0
              }}
              onFocus={(e) => e.target.style.borderColor = accent}
              onBlur={(e) => e.target.style.borderColor = 'var(--hair)'} />
            
              <button
              onClick={() => {if (contactEmail.includes('@')) {fetch('https://formspree.io/f/mlgznnpn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:contactEmail})}).then(()=>setSubmitted(true));}}}
              style={{
                padding: '16px 32px', background: accent, border: 'none',
                color: '#fff', fontSize: 12, fontFamily: "'Inter',sans-serif",
                fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
                cursor: 'pointer', transition: 'opacity 0.2s', borderRadius: 0
              }}
              onMouseEnter={(e) => e.currentTarget.style.opacity = '0.85'}
              onMouseLeave={(e) => e.currentTarget.style.opacity = '1'}>
                Book a call →
              </button>
            </div>
          }
        </div>
      </section>

      {/* Footer */}
      <footer style={{ padding: '32px 8vw', borderTop: '1px solid var(--hair)', background: 'var(--bg)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 15, color: 'var(--ink-dim)' }}>Nick Glenny</div>
        <div style={{ display: 'flex', gap: 28, alignItems: 'center', fontSize: 12, fontFamily: "'Inter',sans-serif" }}>
          <a href="#contact" style={{ color: 'var(--ink-soft)', textDecoration: 'none', borderBottom: `1px solid ${accent}55`, paddingBottom: 2 }}>Still on the fence? Book a call →</a>
          <a href="mailto:nickglenny@gmail.com" style={{ color: 'var(--ink-dim)', textDecoration: 'none' }}>nickglenny@gmail.com</a>
        </div>
        <div style={{ fontSize: 11, color: 'var(--ink-dim)', fontFamily: "'Inter',sans-serif", letterSpacing: '0.08em' }}>© 2026</div>
      </footer>

      <style>{`
        @keyframes scrollpulse {
          0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
          50% { opacity: 1; transform: scaleY(1); }
        }
        .ig-feed-scroll {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .ig-feed-scroll::-webkit-scrollbar {
          display: none;
        }
        @media (max-width: 900px) {
          .work-grid { grid-template-columns: 1fr !important; }
          .case-panel-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
          .case-panel-image { order: 1 !important; }
          .case-panel-copy { order: 2 !important; }
        }
      `}</style>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);



</script>


</body></html>
