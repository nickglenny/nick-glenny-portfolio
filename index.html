<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    /* Warm paper palette — editorial redesign */
    --bg: #EFEAD8;          /* page background */
    --bg2: #E8E1CC;          /* surface 2 */
    --bg3: #DDD4BA;          /* surface 3 */
    --ink: #1A1612;          /* primary text */
    --ink-soft: #3A332B;     /* body copy */
    --ink-dim: #6B6256;      /* secondary / labels */
    --ink-faint: #B8B3A6;    /* faint */
    --hair: rgba(26,22,18,0.12);
    --hair-strong: rgba(26,22,18,0.22);
    --accent: #C2410C;       /* burnt orange */
    --accent-dim: rgba(194,65,12,0.12);
    --accent-soft: rgba(194,65,12,0.12);
    --body-weight: 400;
    --display: 'Instrument Serif', 'Playfair Display', Georgia, serif;
    --sans: 'Google Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: var(--display); /* legacy alias */
    --border: var(--hair);

    --text: var(--ink);
    --muted: var(--ink-dim);
  }

  html { scroll-behavior: smooth; background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); overflow-x: hidden; }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  ::selection { background: var(--accent); color: #fff; }
  body { font-weight: var(--body-weight); }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); }

  /* Tweaks panel */
  #tweaks-panel {
    position: fixed;
    bottom: 24px; right: 24px;
    background: #FAF7EE;
    border: 1px solid var(--hair);
    border-radius: 4px;
    padding: 20px 22px 16px;
    width: 280px;
    z-index: 9000;
    display: none;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(14,13,10,0.04), 0 24px 60px rgba(14,13,10,0.18);
  }
  #tweaks-panel.visible { display: block; }
  #tweaks-panel .panel-title {
    display:flex; justify-content:space-between; align-items:center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-dim);
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 18px;
  }
  #tweaks-panel .panel-title .panel-title-l { display:flex; align-items:center; }
  #tweaks-panel .panel-title .panel-title-l::before {
    content:""; width:6px; height:6px; border-radius:50%; background: var(--accent); margin-right: 10px; flex:0 0 auto;
  }
  #tweaks-panel .panel-close {
    background:none; border:0; color: var(--ink-dim); cursor:pointer; font-size:16px; line-height:1; padding:0;
  }
  #tweaks-panel .panel-close:hover { color: var(--ink); }

  .tweak-group { margin-bottom: 20px; }
  .tweak-group:last-child { margin-bottom: 4px; }
  .tweak-group .tweak-label {
    display:block;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  /* Background swatches — 2 rows of 5 */
  .bg-swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .bg-swatch {
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid var(--hair);
    transition: box-shadow .15s, border-color .15s, transform .15s;
    position: relative;
  }
  .bg-swatch:hover { transform: translateY(-1px); border-color: rgba(14,13,10,0.3); }
  .bg-swatch.active {
    border-color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--ink);
  }
  .bg-swatch[title]:hover::after {
    content: attr(title);
    position: absolute;
    bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); background: #FAF7EE; border:1px solid var(--hair);
    padding: 3px 7px; border-radius: 2px; white-space: nowrap;
    pointer-events: none;
    z-index: 5;
  }

  /* Segmented control */
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--hair);
    border-radius: 2px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background .15s, color .15s;
    border-right: 1px solid var(--hair);
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--bg); }

  /* Accent swatch row — 8 small pills with dot+name */
  .accent-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .accent-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px;
    border: 1px solid var(--hair);
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .01em;
    color: var(--ink-dim);
    text-align: left;
    overflow:hidden;
  }
  .accent-pill:hover { border-color: rgba(14,13,10,0.3); color: var(--ink); }
  .accent-pill.active { border-color: var(--ink); background: rgba(14,13,10,0.04); color: var(--ink); }
  .accent-pill .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
    box-shadow: 0 0 0 1px rgba(14,13,10,0.10);
  }
  .accent-pill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ─── Editorial redesign utilities ─── */

  /* Marquee */
  @keyframes marquee-scroll {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-50%,0,0); }
  }
  .marquee {
    overflow: hidden; width: 100%;
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    background: var(--bg);
    padding: 28px 0;
  }
  .marquee-track {
    display: flex; width: max-content;
    animation: marquee-scroll 44s linear infinite;
    will-change: transform;
  }
  .marquee.slow .marquee-track { animation-duration: 64s; }
  .marquee.reverse .marquee-track { animation-direction: reverse; }
  .marquee-track > span {
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(40px, 6vw, 96px);
    line-height: 1; color: var(--ink);
    padding: 0 32px;
    display: inline-flex; align-items: center;
    white-space: nowrap;
  }
  .marquee-track > span::after {
    content: ''; display: inline-block;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); margin-left: 48px;
  }
  .marquee.mono .marquee-track > span {
    font-family: var(--mono);
    font-style: normal;
    font-size: clamp(14px, 1.2vw, 18px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* Rotating badge */
  @keyframes spin-slow { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .badge {
    position: relative; width: 100%;
    aspect-ratio: 1/1; max-width: 360px;
    margin: 0 auto;
  }
  .badge-ring { position: absolute; inset: 0; animation: spin-slow 28s linear infinite; }
  .badge-ring svg { width: 100%; height: 100%; display: block; }
  .badge-ring text {
    font-family: var(--mono);
    font-size: 6.6px; letter-spacing: 0.29em;
    fill: var(--ink); text-transform: uppercase;
    font-weight: 500;
  }
  .hero-edit.has-video .badge-ring text { fill: #FBF6E8; }
  .badge-core {
    position: absolute; inset: 18%;
    border-radius: 50%;
    background: var(--accent);
    color: #FBF6E8;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 60px -20px rgba(26,22,18,0.55);
    overflow: hidden;
  }
  .badge-core::before {
    content: ''; position: absolute; inset: 6%;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
  }
  .badge-core .ng {
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(78px, 10vw, 132px);
    line-height: 0.85;
    letter-spacing: -0.03em;
    text-align: center;
  }
  .badge-core .ng small {
    display: block;
    font-family: var(--mono);
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.32em;
    margin-top: 14px;
    opacity: 0.85;
  }

  /* Pill button */
  .btn-pill {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 26px 16px 30px;
    border-radius: 999px;
    background: var(--ink); color: #FBF6E8;
    font-family: var(--mono); font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    border: 1px solid var(--ink);
    text-decoration: none;
    transition: background 0.25s, color 0.25s, transform 0.25s, border-color 0.25s;
  }
  .btn-pill .arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: 14px;
    transition: transform 0.3s;
  }
  .btn-pill:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
  .btn-pill:hover .arrow { background: #fff; color: var(--accent); transform: rotate(-45deg); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: #FBF6E8; }
  .btn-ghost:hover .arrow { background: #FBF6E8; color: var(--ink); }

  /* Hero editorial layout */
  .hero-edit {
    min-height: 100vh;
    padding: 110px clamp(20px, 5vw, 56px) 56px;
    display: grid;
    grid-template-columns: 1.85fr 1fr;
    gap: 28px;
    align-items: center;
    position: relative;
    background: var(--bg);
  }
  .hero-edit .badge { margin: 0 0 0 auto; }
  .hero-edit .hero-grain {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(194,65,12,0.05), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(26,22,18,0.04), transparent 60%);
    pointer-events: none;
    z-index: 1;
  }
  .hero-edit .hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
    opacity: 0.7;
  }
  .hero-edit .hero-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,22,18,0.5) 0%, rgba(26,22,18,0.62) 55%, rgba(26,22,18,0.78) 100%);
    z-index: 1;
    pointer-events: none;
  }
  .hero-edit .hero-content,
  .hero-edit .hero-badge-wrap { position: relative; z-index: 2; }
  .hero-edit.has-video { background: var(--ink); }
  .hero-edit.has-video h1 { color: #FBF6E8; }
  .hero-edit.has-video .lede { color: rgba(251,246,232,0.82); }
  .hero-edit.has-video .eyebrow-line { color: rgba(251,246,232,0.65); }
  .hero-edit.has-video .stat span { color: rgba(251,246,232,0.55); }
  .hero-edit.has-video .btn-ghost { color: #FBF6E8; border-color: rgba(251,246,232,0.55); }
  .hero-edit.has-video .btn-ghost:hover { background: #FBF6E8; color: var(--ink); border-color: #FBF6E8; }
  .hero-edit h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(44px, 6.2vw, 84px);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 18px 0 22px;
  }
  .hero-edit h1 em { font-style: italic; color: var(--accent); }
  .hero-edit .lede {
    font-family: var(--sans);
    font-size: clamp(14px, 1.15vw, 17px);
    color: var(--ink-soft);
    max-width: 42ch;
    line-height: 1.65;
    margin-bottom: 28px;
  }
  .hero-edit .hero-meta {
    display: flex; gap: 28px; align-items: center;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .hero-edit .stat { display: flex; flex-direction: column; gap: 4px; }
  .hero-edit .stat b {
    font-family: var(--display); font-style: italic;
    font-size: 34px; font-weight: 400;
    color: var(--accent); line-height: 1;
  }
  .hero-edit .stat span {
    font-family: var(--mono);
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--ink-dim);
  }
  .hero-edit .divider { width: 1px; height: 38px; background: var(--hair); }
  .hero-edit .eyebrow-line {
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--ink-dim); font-weight: 500;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .hero-edit .eyebrow-line::before {
    content: ''; display: inline-block;
    width: 24px; height: 1px; background: var(--accent);
  }

  /* Ink-on-dark contact */
  .contact-dark {
    background: var(--ink);
    color: #FBF6E8;
    border-top: 1px solid var(--ink);
    overflow: hidden;
    position: relative;
  }
  .contact-dark .eyebrow-line { color: rgba(251,246,232,0.6); }
  .contact-dark h2 {
    font-family: var(--display); font-weight: 400;
    color: #FBF6E8;
    font-size: clamp(56px, 9vw, 156px);
    line-height: 1.02; letter-spacing: -0.01em;
    margin: 24px 0 32px;
  }
  .contact-dark h2 em { font-style: italic; color: var(--accent); }
  .contact-dark .lede {
    font-family: var(--sans);
    color: rgba(251,246,232,0.7);
    font-size: 18px; max-width: 44ch;
    line-height: 1.7; margin-bottom: 48px;
  }
  .contact-dark .contact-row {
    display: flex; gap: 0;
    border: 1px solid rgba(251,246,232,0.18);
    border-radius: 999px; overflow: hidden;
    max-width: 540px;
    background: rgba(251,246,232,0.04);
  }
  .contact-dark .contact-row input {
    flex: 1; background: transparent; border: none;
    padding: 18px 24px;
    color: #FBF6E8; font-family: var(--sans);
    font-size: 15px; outline: none;
  }
  .contact-dark .contact-row input::placeholder { color: rgba(251,246,232,0.4); }
  .contact-dark .contact-row button {
    border: none; background: var(--accent); color: #fff;
    padding: 14px 22px; margin: 4px;
    border-radius: 999px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    transition: background 0.25s, transform 0.25s;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .contact-dark .contact-row button:hover { background: #FBF6E8; color: var(--ink); transform: translateX(2px); }
  .contact-dark .contact-confirm {
    border: 1px solid rgba(251,246,232,0.2);
    padding: 24px 28px; border-radius: 4px;
    background: rgba(251,246,232,0.04);
    max-width: 540px;
  }
  .contact-dark .contact-confirm b {
    font-family: var(--display); font-style: italic;
    font-weight: 400; font-size: 24px; color: var(--accent);
  }
  .contact-dark .contact-confirm p { color: rgba(251,246,232,0.7); margin-top: 8px; font-size: 14px; font-family: var(--sans); }
  .contact-dark .contact-meta {
    margin-top: 64px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 32px; padding-top: 36px;
    border-top: 1px solid rgba(251,246,232,0.15);
  }
  .contact-dark .contact-meta .col span {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(251,246,232,0.45);
  }
  .contact-dark .contact-meta .col p {
    margin-top: 10px;
    font-family: var(--display); font-size: 20px;
    color: #FBF6E8;
  }
  .contact-dark .big-badge {
    position: absolute; right: -100px; top: 40px;
    width: 320px; height: 320px;
    opacity: 0.25;
    animation: spin-slow 40s linear infinite;
    pointer-events: none;
    color: #FBF6E8;
  }

  /* Mini badge (used on About portrait) */
  .portrait-badge {
    position: absolute;
    bottom: -32px; right: -32px;
    width: 130px; height: 130px;
    z-index: 2;
    animation: spin-slow 32s linear infinite;
    color: var(--ink);
  }

  /* ─── Mobile responsive ─── */
  @media (max-width: 960px) {
    /* Hero */
    .hero-edit {
      grid-template-columns: 1fr !important;
      padding: 110px 22px 60px !important;
      gap: 32px !important;
      min-height: auto !important;
    }
    /* On mobile drop the video and the dark scrim — revert to the warm paper hero */
    .hero-edit .hero-video,
    .hero-edit .hero-scrim { display: none !important; }
    .hero-edit.has-video { background: var(--bg); }
    .hero-edit.has-video h1 { color: var(--ink); }
    .hero-edit.has-video .lede { color: var(--ink-soft); }
    .hero-edit.has-video .eyebrow-line { color: var(--ink-dim); }
    .hero-edit.has-video .stat span { color: var(--ink-dim); }
    .hero-edit.has-video .btn-ghost { color: var(--ink); border-color: var(--ink); }
    .hero-edit.has-video .btn-ghost:hover { background: var(--ink); color: #FBF6E8; border-color: var(--ink); }
    .hero-edit h1 { font-size: clamp(40px, 9vw, 64px) !important; margin: 18px 0 22px !important; }
    .hero-edit .lede { font-size: 15px !important; margin-bottom: 28px !important; }
    .hero-edit .hero-meta { gap: 18px !important; margin-top: 32px !important; }
    .hero-edit .hero-meta .divider { display: none; }
    .hero-edit .badge,
    .hero-edit .hero-badge-wrap { max-width: 240px; margin: 0 auto; order: 2; }
    .badge-core .ng { font-size: clamp(56px, 14vw, 78px) !important; }

    /* Marquees */
    .marquee { padding: 18px 0; }
    .marquee-track > span { font-size: clamp(28px, 8vw, 44px); padding: 0 22px; }
    .marquee-track > span::after { width: 8px; height: 8px; margin-left: 28px; }
    .marquee.mono .marquee-track > span { font-size: 12px; padding: 0 20px; }

    /* About — stack 1-col and reposition portrait badge inside the viewport */
    .about-grid { grid-template-columns: 1fr !important; gap: 56px !important; }
    .about-grid > div:last-child { max-width: 320px; margin-left: 0; }
    .portrait-badge {
      bottom: -22px !important; right: -10px !important;
      width: 92px !important; height: 92px !important;
    }

    /* Contact (ink-on-dark) */
    .contact-dark h2 { font-size: clamp(44px, 12vw, 72px) !important; line-height: 1.04 !important; margin: 18px 0 22px !important; }
    .contact-dark .lede { font-size: 15px !important; margin-bottom: 32px !important; }
    .contact-dark .contact-row { flex-direction: column; border-radius: 12px; gap: 4px; padding: 4px; }
    .contact-dark .contact-row input { padding: 14px 18px; }
    .contact-dark .contact-row button { width: 100%; margin: 0; justify-content: center; padding: 14px; }
    .contact-dark .contact-meta { grid-template-columns: 1fr !important; gap: 22px; }
    .contact-dark .big-badge { right: -160px; top: 20px; width: 240px; height: 240px; opacity: 0.18; }

    /* Pill button — full width on mobile so taps are easy */
    .hero-edit .btn-pill { width: 100%; justify-content: space-between; padding: 14px 22px; }
    .hero-edit .btn-pill .arrow { margin-left: auto; }

    /* General section padding tightening */
    section { padding-left: 22px; padding-right: 22px; }

    /* Tweaks panel — hide on mobile (it overlays content and is hard to use) */
    #tweaks-panel { display: none !important; }

    /* Site nav — drop links on mobile, keep brand visible */
    .site-nav { padding: 16px 22px !important; }
    .site-nav-links { display: none !important; }
  }

  @media (max-width: 540px) {
    .hero-edit { padding-top: 96px !important; }
    .hero-edit h1 { font-size: clamp(36px, 11vw, 52px) !important; }
    .hero-edit .hero-meta { gap: 14px !important; flex-direction: column; align-items: flex-start; }
    .hero-edit .hero-meta .stat { flex-direction: row; align-items: baseline; gap: 12px; }
    .hero-edit .hero-meta .stat b { font-size: 26px; }
    .marquee-track > span { font-size: clamp(22px, 8vw, 32px); padding: 0 16px; }
    .contact-dark .contact-meta .col p { font-size: 17px; }
  }
</style>

<body>

<div id="root"></div>
<div id="tweaks-panel">
  <div class="panel-title">
    <span class="panel-title-l">Tweaks</span>
    <button class="panel-close" id="panel-close" aria-label="Close">×</button>
  </div>

  <div class="tweak-group">
    <span class="tweak-label">Background</span>
    <div class="bg-swatches" id="bg-swatches">
      <div class="bg-swatch" data-bg="bone" data-color="#EAE6DC" style="background:#EAE6DC" title="Bone"></div>
      <div class="bg-swatch" data-bg="cream" data-color="#F1E9D2" style="background:#F1E9D2" title="Cream"></div>
      <div class="bg-swatch" data-bg="paper" data-color="#F4F0E6" style="background:#F4F0E6" title="Paper"></div>
      <div class="bg-swatch" data-bg="stone" data-color="#D6D2C5" style="background:#D6D2C5" title="Stone"></div>
      <div class="bg-swatch" data-bg="sand" data-color="#E2D6BE" style="background:#E2D6BE" title="Sand"></div>
      <div class="bg-swatch" data-bg="mist" data-color="#E0E2DD" style="background:#E0E2DD" title="Mist"></div>
      <div class="bg-swatch" data-bg="pearl" data-color="#EFEDE6" style="background:#EFEDE6" title="Pearl"></div>
      <div class="bg-swatch" data-bg="ash" data-color="#CFCEC8" style="background:#CFCEC8" title="Ash"></div>
      <div class="bg-swatch" data-bg="linen" data-color="#ECE5D6" style="background:#ECE5D6" title="Linen"></div>
      <div class="bg-swatch" data-bg="ivory" data-color="#F8F2E1" style="background:#F8F2E1" title="Ivory"></div>
    </div>
  </div>

  <div class="tweak-group">

// ─── Intersection observer hook ───────────────────────────────────────────────
function useReveal(threshold = 0.1, startVisible = false) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(startVisible);
  useEffect(() => {
    if (startVisible) return;
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {setVisible(true);obs.disconnect();}
    }, { threshold, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, [startVisible]);
  return [ref, visible];
}

// ─── prefers-reduced-motion check ─────────────────────────────────────────────
const prefersReducedMotion = () =>
  typeof window !== 'undefined' &&
  window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─── Word-by-word reveal helper ───────────────────────────────────────────────
// Renders `text` split into per-word <span>s with a staggered translate+fade.
// `visible` is driven by the parent's IntersectionObserver. `base` lets a second
// line start later than the first so two-line headings cascade naturally.
function Words({ text, visible, base = 0, step = 55, style }) {
  const reduce = prefersReducedMotion();
  const words = text.split(' ');
  return words.map((w, i) =>
    <React.Fragment key={i}>
      <span style={{
        display: 'inline-block',
        opacity: visible ? 1 : 0,
        transform: visible ? 'translateY(0)' : 'translateY(0.45em)',
        transition: reduce ? 'none' : 'opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1)',
        transitionDelay: reduce ? '0ms' : `${base + i * step}ms`,
        willChange: 'transform, opacity',
        ...style
      }}>{w}</span>
      {i < words.length - 1 && ' '}
    </React.Fragment>
  );
}

// ─── Scroll-driven word color fill ────────────────────────────────────────────
// Each word transitions from `dimColor` → `fullColor` as the heading scrolls
// from `fillRange[0]` × viewport-height to `fillRange[1]` × viewport-height
// (measured from the top of the viewport). Tighter range = punchier moment.
function ScrollFillWords({ text, dimColor, fullColor, fillRange = [0.7, 0.3] }) {
  const ref = useRef(null);
  const [progress, setProgress] = useState(() => (prefersReducedMotion() ? 1 : 0));
  const words = text.split(' ');

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el) return;
    let raf = null;
    const update = () => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || 1;
      const startY = vh * fillRange[0];
      const endY = vh * fillRange[1];
      const p = (startY - rect.top) / (startY - endY);
      setProgress(Math.max(0, Math.min(1, p)));
    };
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { update(); raf = null; });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
    return () => {
      window.removeEventListener('scroll', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [fillRange[0], fillRange[1]]);

  return (
    <span ref={ref}>
      {words.map((w, i) => {
        const threshold = words.length > 1 ? i / (words.length - 1) : 0;
        const filled = progress >= threshold;
        return (
          <React.Fragment key={i}>
            <span style={{
              color: filled ? fullColor : dimColor,
              transition: 'color 0.45s cubic-bezier(0.22, 1, 0.36, 1)'
            }}>{w}</span>
            {i < words.length - 1 && ' '}
          </React.Fragment>
        );
      })}
    </span>
  );
}

// ─── Magnetic button wrapper ──────────────────────────────────────────────────
// Outer span = stable position anchor (its rect drives the cursor distance math).
// Inner span = magnetic translate (the part that visibly drifts toward cursor).
// Inner <a> keeps .btn-pill:hover transform intact — both transforms compose.
function MagneticButton({ href, className, children, strength = 0.28, radius = 110 }) {
  const wrapRef = useRef(null);
  const innerRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const wrap = wrapRef.current;
    const inner = innerRef.current;
    if (!wrap || !inner) return;

    let raf = null;
    let lastX = 0, lastY = 0;

    const onMove = (e) => {
      const rect = wrap.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const inRange = dist < radius;
      const tx = inRange ? dx * strength : 0;
      const ty = inRange ? dy * strength : 0;
      if (Math.abs(tx - lastX) < 0.4 && Math.abs(ty - lastY) < 0.4) return;
      lastX = tx; lastY = ty;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        inner.style.transform = `translate(${tx}px, ${ty}px)`;
      });
    };

    document.addEventListener('mousemove', onMove);
    return () => {
      document.removeEventListener('mousemove', onMove);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [strength, radius]);

  return (
    <span ref={wrapRef} style={{ display: 'inline-block' }}>
      <span ref={innerRef} style={{
        display: 'inline-block',
        transition: 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)',
        willChange: 'transform'
      }}>
        <a href={href} className={className}>{children}</a>
      </span>
    </span>
  );
}

function AdLightbox({ children, onClose }) {
  useEffect(() => {
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 2000,
      background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(8px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{ position: 'relative', width: '100%', maxWidth: 480 }}>
        {children}
        <button onClick={onClose} style={{

// ─── Generic mockup feed (swipeable container) ────────────────────────────────
function MockupFeed({ items, renderItem, accent }) {
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);

  const onScroll = () => {
    if (!scrollRef.current) return;
    const w = scrollRef.current.clientWidth;
    const idx = Math.round(scrollRef.current.scrollLeft / w);
    if (idx !== activeIdx) setActiveIdx(idx);
  };

  const goto = (i) => {
    if (!scrollRef.current) return;
    scrollRef.current.scrollTo({ left: i * scrollRef.current.clientWidth, behavior: 'smooth' });
  };

  return (
    <div>
      <div style={{
        position: 'relative',
        background: '#fff',
        borderRadius: 6,
        overflow: 'hidden',
        boxShadow: '0 30px 80px rgba(14,13,10,0.18), 0 4px 12px rgba(14,13,10,0.06)'
      }}>
        <div ref={scrollRef} onScroll={onScroll} className="ig-feed-scroll" style={{
          display: 'flex',
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          WebkitOverflowScrolling: 'touch'
        }}>
          {items.map((item, i) => renderItem(item, i, items.length))}
        </div>
      </div>

      {/* Pagination */}
      <div style={{
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: 8, marginTop: 18,
        fontFamily: "'Google Sans',sans-serif"
      }}>
        <button onClick={() => goto(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === 0 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === 0 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === 0 ? 0.4 : 1
        }}>‹</button>
        <div style={{ display: 'flex', gap: 6 }}>
          {items.map((_, i) =>
            <button key={i} onClick={() => goto(i)} style={{
              width: 7, height: 7, borderRadius: '50%',
              background: i === activeIdx ? accent : 'var(--hair-strong, rgba(0,0,0,0.2))',
              border: 'none', padding: 0, cursor: 'pointer',
              transition: 'background 0.2s, transform 0.2s',
              transform: i === activeIdx ? 'scale(1.2)' : 'scale(1)'
            }} />
          )}
        </div>
        <button onClick={() => goto(Math.min(items.length - 1, activeIdx + 1))} disabled={activeIdx === items.length - 1} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === items.length - 1 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === items.length - 1 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === items.length - 1 ? 0.4 : 1
        }}>›</button>
        <div style={{ marginLeft: 8, fontSize: 11, color: 'var(--ink-dim)', letterSpacing: '0.08em', fontFamily: "'Google Sans',sans-serif" }}>
          {String(activeIdx + 1).padStart(2, '0')} / {String(items.length).padStart(2, '0')}
        </div>
      </div>
    </div>);

}

// ─── Case Study Panel (long-scroll format) ────────────────────────────────────
function CaseStudyPanel({ project, accent, index = 0, side = 'image-left' }) {
  const sectionRef = useRef(null);
  const [visible, setVisible] = useState(false);
  const [progress, setProgress] = useState(0);
  const isImageLeft = side === 'image-left';
  const sectionBg = index % 2 === 0 ? 'var(--bg)' : 'var(--bg2)';
  const headlineMetric = project.metricLabel.split(',')[0];

  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);

    if (prefersReducedMotion()) return () => obs.disconnect();

    let raf = null;
    const update = () => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || 1;
      // 0 when section's top hits viewport bottom, 1 when section's bottom passes viewport top.
      const total = rect.height + vh;
      const seen = vh - rect.top;
      setProgress(Math.max(0, Math.min(1, seen / total)));
    };
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { update(); raf = null; });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
    return () => {
      obs.disconnect();
      window.removeEventListener('scroll', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Subtle scrub: image breathes in slightly as the section passes through view.
  const scrubScale = 1 + progress * 0.04;
  const scrubLift = -progress * 12;

  return (
    <section ref={sectionRef} style={{
      padding: '120px 8vw',
      background: sectionBg,
      borderTop: '1px solid var(--hair)',
      transition: 'opacity 0.9s',
      opacity: visible ? 1 : 0
    }}>
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(2, minmax(0, 1fr))',
        gap: 80,
        alignItems: 'start',
        maxWidth: 1280,
        margin: '0 auto'
      }} className="case-panel-grid">
        {/* Hero creative — sticky-pinned while the copy column scrolls past */}
        <div style={{ order: isImageLeft ? 1 : 2 }} className="case-panel-image">
          <div className="case-panel-sticky" style={{
            position: 'sticky',
            top: 'clamp(88px, 12vh, 140px)',
            transform: `scale(${scrubScale}) translateY(${scrubLift}px)`,
            transformOrigin: 'center center',
            willChange: 'transform'
          }}>
          <MockupFeed
            items={project.creatives}
            accent={accent}
            renderItem={(c, i, total) => {
              const dayLabel = c.day !== undefined ? `Day ${c.day}` : null;
              if (c.kind === 'photo' || c.kind === 'carousel') {
                return <InstagramPost key={i} creative={c} brand={project.client} accent={accent} />;
              }
              if (c.kind === 'sms') {
                return <SMSPost key={i} creative={c} brand={project.client} accent={accent} index={i} total={total} dayLabel={dayLabel} />;
              }
              return <EmailPost key={i} creative={c} brand={project.client} accent={accent} index={i} total={total} dayLabel={dayLabel} />;
            }}
          />
          </div>
        </div>

        {/* Copy */}
        <div style={{ order: isImageLeft ? 2 : 1 }} className="case-panel-copy">
          <div style={{ fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: accent, marginBottom: 24, fontFamily: "'Google Sans',sans-serif", fontWeight: 500 }}>
            Case {String(index + 1).padStart(2, '0')} · {project.type}
          </div>

          <h3 style={{
            fontFamily: 'var(--display)',
            fontSize: 'clamp(48px,6vw,84px)',
            fontWeight: 400,
            color: 'var(--ink)',
            lineHeight: 1,
            letterSpacing: '-0.02em',
            marginBottom: 16
          }}>
            {project.metric}<br />
            <span style={{ color: accent, fontStyle: 'italic', fontWeight: 700, fontSize: '0.55em', display: 'inline-block', marginTop: 8 }}>
              {headlineMetric}
            </span>
          </h3>

          <div style={{
            fontFamily: "'Google Sans',sans-serif",
            fontSize: 22,
            color: 'var(--ink-soft)',
            marginBottom: 36,
            fontStyle: 'italic'
          }}>
            for {project.client}
          </div>

          <div style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 10, fontFamily: "'Google Sans',sans-serif" }}>The Goal</div>
            <p style={{ fontSize: 16, lineHeight: 1.65, color: 'var(--ink)', fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)' }}>
              {project.goal}
            </p>
          </div>

          <div style={{ marginBottom: 36 }}>

            <p style={{ fontSize: 16, lineHeight: 1.65, color: 'var(--ink)', fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)' }}>

/* Phone mockup with a reel inside. Autoplays muted when on screen; tap toggles sound. */
function PhoneReel({ item }) {
  const vidRef = useRef(null);
  const [sound, setSound] = useState(false);
  useEffect(() => {
    const v = vidRef.current;
    if (!v) return;
    v.muted = true;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else { v.pause(); }
    }, { threshold: 0.35 });
    obs.observe(v);
    return () => obs.disconnect();
  }, []);
  const toggle = () => {
    const v = vidRef.current; if (!v) return;
    const next = !sound; v.muted = !next; setSound(next);
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  };
  return (
    <div className="phone-wrap">
      <button type="button" className="phone" onClick={toggle} aria-label={(sound ? 'Mute ' : 'Unmute ') + item.title}>
        <div className="phone-screen">

function App() {
  const [accent, setAccent] = useState('#C2410C');
  const [smokeEnabled, setSmokeEnabled] = useState(true);
  const [compact, setCompact] = useState(false);
  const [contactEmail, setContactEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [openFaq, setOpenFaq] = useState(null);

  const [heroRef, heroVisible] = useReveal(0, true);
  const [workRef, workVisible] = useReveal(0.25);
  const [servicesRef, servicesVisible] = useReveal(0.25);
  const [faqRef, faqVisible] = useReveal(0.25);
  const [aboutRef, aboutVisible] = useReveal(0.1);
  const [contactRef, contactVisible] = useReveal(0.1);

  // Tweaks panel wiring
  useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    if (!panel) return;

    // Each bg name → [page, surface2, surface3] tuple. Same hue family, stepped lightness.
    const BG_PALETTES = {
      bone: ['#EAE6DC', '#F2EFE6', '#DCD7C9'],
      cream: ['#F1E9D2', '#F8F2E0', '#E4DAC0'],
      paper: ['#F4F0E6', '#FAF7EE', '#E6E0D2'],
      stone: ['#D6D2C5', '#DEDBCF', '#C7C2B3'],
      sand: ['#E2D6BE', '#EBE1CC', '#D2C5A8'],
      mist: ['#E0E2DD', '#E9EBE6', '#D0D2CC'],
      pearl: ['#EFEDE6', '#F6F4ED', '#E1DED5'],
      ash: ['#CFCEC8', '#D8D7D1', '#BFBEB7'],
      linen: ['#ECE5D6', '#F4EEE0', '#DDD4C0'],
      ivory: ['#F8F2E1', '#FCF7EA', '#EDE3CB']
    };

    const root = document.documentElement.style;

    const applyBg = (name) => {
      const p = BG_PALETTES[name] || BG_PALETTES.bone;
      root.setProperty('--bg', p[0]);
      root.setProperty('--bg2', p[1]);
      root.setProperty('--bg3', p[2]);
    };
    const applyWeight = (w) => root.setProperty('--body-weight', String(w));
    const applyContrast = (mode) => {
      if (mode === 'high') {
        root.setProperty('--ink', '#000');
        root.setProperty('--ink-dim', '#3A352D');
        root.setProperty('--ink-soft', '#4A453B');
        root.setProperty('--hair', 'rgba(0,0,0,0.18)');
        root.setProperty('--hair-strong', 'rgba(0,0,0,0.32)');
      } else {
        root.setProperty('--ink', '#0E0D0A');
        root.setProperty('--ink-dim', '#5A554D');
        root.setProperty('--ink-soft', '#6E6A60');
        root.setProperty('--hair', 'rgba(14,13,10,0.10)');
        root.setProperty('--hair-strong', 'rgba(14,13,10,0.22)');
      }
    };
    const applyAccent = (c) => {
      root.setProperty('--accent', c);
      // recompute accent-dim as 12% alpha of the hex
      const r = parseInt(c.slice(1, 3), 16),g = parseInt(c.slice(3, 5), 16),b = parseInt(c.slice(5, 7), 16);
      root.setProperty('--accent-dim', `rgba(${r},${g},${b},0.12)`);
      setAccent(c);
    };

    // ── Edit-mode protocol ──
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('visible');
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // ── Close button ──
    const closeBtn = document.getElementById('panel-close');
    if (closeBtn) closeBtn.addEventListener('click', () => {
      panel.classList.remove('visible');
      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
    });

    // ── Background swatches ──
    panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((s) => {
      s.addEventListener('click', () => {
        panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((x) => x.classList.remove('active'));
        s.classList.add('active');
        const name = s.dataset.bg;
        applyBg(name);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { background: name } }, '*');
      });
    });

    // ── Body weight segmented ──
    panel.querySelectorAll('#weight-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        panel.querySelectorAll('#weight-seg button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        const w = b.dataset.weight;
        applyWeight(w);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { bodyWeight: Number(w) } }, '*');
      });
    });

    // ── Contrast segmented ──
    panel.querySelectorAll('#contrast-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        panel.querySelectorAll('#contrast-seg button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        const mode = b.dataset.contrast;
        applyContrast(mode);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { contrast: mode } }, '*');
      });
    });

    // ── Accent pills ──
    panel.querySelectorAll('#accent-list .accent-pill').forEach((p) => {
      p.addEventListener('click', () => {
        panel.querySelectorAll('#accent-list .accent-pill').forEach((x) => x.classList.remove('active'));
        p.classList.add('active');
        const c = p.dataset.color;
        const name = p.dataset.accent;
        applyAccent(c);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: name } }, '*');
      });
    });

    // ── Apply initial values from TWEAK_DEFAULTS ──
    const t = typeof TWEAK_DEFAULTS !== 'undefined' ? TWEAK_DEFAULTS : {};
    if (t.background) {
      applyBg(t.background);
      const sw = panel.querySelector(`#bg-swatches .bg-swatch[data-bg="${t.background}"]`);
      if (sw) {panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((x) => x.classList.remove('active'));sw.classList.add('active');}
    }
    if (t.bodyWeight) {
      applyWeight(t.bodyWeight);
      const wb = panel.querySelector(`#weight-seg button[data-weight="${t.bodyWeight}"]`);
      if (wb) {panel.querySelectorAll('#weight-seg button').forEach((x) => x.classList.remove('on'));wb.classList.add('on');}
    }
    if (t.contrast) {
      applyContrast(t.contrast);
      const cb = panel.querySelector(`#contrast-seg button[data-contrast="${t.contrast}"]`);
      if (cb) {panel.querySelectorAll('#contrast-seg button').forEach((x) => x.classList.remove('on'));cb.classList.add('on');}
    }
    if (t.accent) {
      const pill = panel.querySelector(`#accent-list .accent-pill[data-accent="${t.accent}"]`);
      if (pill) {
        applyAccent(pill.dataset.color);
        panel.querySelectorAll('#accent-list .accent-pill').forEach((x) => x.classList.remove('active'));
        pill.classList.add('active');
      }
    }

    return () => window.removeEventListener('message', onMsg);
  }, []);

  return (
    <>
      <Nav accent={accent} />

      {/* ── HERO (editorial redesign) ── */}
      <header id="top" className="hero-edit has-video">
        {/* Background video. Swap the src URL with any direct .mp4 from Pexels/Coverr/Mixkit. */}
        <video className="hero-video" autoPlay loop muted playsInline preload="metadata">

        <div className="hero-scrim" />

        <div ref={heroRef} className="hero-content" style={{

        }}>
          <div className="eyebrow-line">Content + Marketing / Fitness &amp; Lifestyle Brands</div>
          <h1>
            Two things I'd test on your studio's funnel. <em>Before your next campaign goes live.</em>
          </h1>
          <p className="lede">

          </p>
          <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>

            <MagneticButton href="#work" className="btn-pill btn-ghost">See the work <span className="arrow">↓</span></MagneticButton>
          </div>

            <Words text="Real clients. Real content." visible={workVisible} />

                    alignItems: 'center',
                    justifyContent: 'center',
                    transition: 'transform 0.3s ease, border-color 0.25s, background 0.25s',
                    transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                    background: isOpen ? accent + '14' : 'transparent'
                  }}>
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <polyline points="1,1 5,5 9,1" stroke={isOpen ? accent : 'var(--ink-dim)'} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  </span>
                </button>
                <div style={{
                  maxHeight: isOpen ? 400 : 0,
                  opacity: isOpen ? 1 : 0,
                  overflow: 'hidden',
                  transition: 'max-height 0.4s ease, opacity 0.3s ease'
                }}>
                  <p style={{
                    fontSize: 15,
                    color: 'var(--ink-soft)',
                    lineHeight: 1.75,
                    fontFamily: "'Google Sans',sans-serif",
                    fontWeight: 'var(--body-weight)',
                    padding: '0 0 32px 0',
                    maxWidth: 680,
                    margin: 0
                  }}>{item.a}</p>
                </div>
              </div>);
          })}
        </div>
      </section>

      {/* ── ABOUT ── */}
      <section id="about" style={{ padding: '100px 8vw', background: 'var(--bg2)', borderTop: '1px solid var(--hair)' }}>
        <div ref={aboutRef} className="about-grid" style={{
          display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '80px', alignItems: 'center',
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: aboutVisible ? 1 : 0,
          transform: aboutVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 20, fontFamily: "'Google Sans',sans-serif" }}>About</div>
            <h2 style={{ fontFamily: 'var(--display)', fontSize: 'clamp(24px,3vw,42px)', fontWeight: 400, color: 'var(--ink)', lineHeight: 1.15, marginBottom: 28, letterSpacing: '-0.02em' }}>
              <ScrollFillWords
                text="I sold the memberships. I ran the floor."
                dimColor="var(--ink-dim)"
                fullColor="var(--ink)"
              />
              <br />
              <em>
                <ScrollFillWords
                  text="Now I run the marketing."
                  dimColor="var(--ink-dim)"
                  fullColor={accent}
                />
              </em>
            </h2>
            <div style={{ fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.85, fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)', maxWidth: 520 }}>
              <p style={{ marginBottom: 20 }}>
                I'm from Orange County, California, born and raised. My relationship with fitness started in high school as an athlete and shifted when I joined a gym for the first time. I came in to train and stayed for the way it made me feel and the community inside it. That's the part of fitness that has shaped every decision since. Over the years I worked inside Pilates studios, strength gyms, and boutique fitness spaces, doing every job that kept the doors open: selling memberships, cleaning equipment, running the floor, sitting across from members and listening to what they actually wanted. Six years of training, three years of working inside the studios that train other people.
              </p>
              <p style={{ marginBottom: 20 }}>
                Marketing was the next thing to click, but it started with psychology. What pulled me in was the question underneath the buying decision: why someone walks into a class on a Tuesday and signs up, what shifts in them between the first email and the third, what makes a person finally do the thing they've been putting off for two years. I studied computer science for a year, then finished an associate's in business administration. Most of what I know about buyer behavior came from watching it happen on the studio floor, not from a textbook. The decisions people make about their bodies are personal. Understanding why they make them is what I find genuinely interesting.
              </p>
              <p>
                Starting this business was the moment those two threads pulled into one. Fitness changed how I think about my body and my time. The point of the work I do now is to bring more people inside that change, by helping the studios that create it stay open and full. I work with fitness studios first, but the framework applies anywhere a service business is trying to move someone from interested to committed. If I can help a studio fill its classes, that studio changes more lives. That's the part of this that feels worth doing.
              </p>
            </div>
          </div>
          {/* Portrait + rotating book-a-call mini-badge */}
          <div style={{ position: 'relative', maxWidth: 400 }}>
            <div style={{ aspectRatio: '4/5', background: 'var(--bg3)', borderRadius: 2, position: 'relative', overflow: 'hidden', boxShadow: '0 18px 48px rgba(26,22,18,0.22), 0 2px 6px rgba(26,22,18,0.08)' }}>
              <img src={(window.__resources && window.__resources.portrait) || 'assets/nick-portrait.png'} alt="Nick Glenny portrait" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            </div>
            <a href="#contact" className="portrait-badge" aria-label="Book a call"><MiniBadge /></a>
          </div>
        </div>
      </section>

      {/* ── CONTACT (ink-on-dark) ── */}
      <section id="contact" className="contact-dark" style={{ padding: 'clamp(100px, 14vh, 160px) clamp(20px, 5vw, 56px)' }}>
        <div className="big-badge"><MiniBadge /></div>
        <div ref={contactRef} style={{
          maxWidth: 760, position: 'relative', zIndex: 2,
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: contactVisible ? 1 : 0,
          transform: contactVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div className="eyebrow-line">04 — Contact</div>
          <h2>
            <Words text="Ready to fill" visible={contactVisible} />
            <br />
            <em>
              <Words text="your classes?" visible={contactVisible} base={280} />
            </em>
          </h2>
          <p className="lede">
            Drop your email. I'll come back this week with two specific things I'd test on your studio's funnel, not a pitch deck.
          </p>

          {submitted ?
          <div className="contact-confirm">
            <b>Got it.</b>
            <p>I'll be in touch this week.</p>
          </div> :
          <div className="contact-row">
            <input
              type="email"
              placeholder="your@email.com"
              value={contactEmail}
              onChange={(e) => setContactEmail(e.target.value)} />
            <button
              onClick={() => {if (contactEmail.includes('@')) {fetch('https://formspree.io/f/mlgznnpn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:contactEmail})}).then(()=>setSubmitted(true));}}}>
              Book a call <span>→</span>
            </button>
          </div>
          }

          <div className="contact-meta">
            <div className="col"><span>Email</span><p>nickglenny@gmail.com</p></div>
            <div className="col"><span>Based</span><p>Available worldwide</p></div>
            <div className="col"><span>Response</span><p>Same week</p></div>
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer style={{ padding: '32px 8vw', borderTop: '1px solid var(--hair)', background: 'var(--bg)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ fontFamily: "'Google Sans',sans-serif", fontSize: 15, color: 'var(--ink-dim)' }}>Nick Glenny</div>
        <div style={{ display: 'flex', gap: 28, alignItems: 'center', fontSize: 12, fontFamily: "'Google Sans',sans-serif" }}>
          <a href="#contact" style={{ color: 'var(--ink-soft)', textDecoration: 'none', borderBottom: `1px solid ${accent}55`, paddingBottom: 2 }}>Still on the fence? Book a call →</a>
          <a href="mailto:nickglenny@gmail.com" style={{ color: 'var(--ink-dim)', textDecoration: 'none' }}>nickglenny@gmail.com</a>
        </div>
        <div style={{ fontSize: 11, color: 'var(--ink-dim)', fontFamily: "'Google Sans',sans-serif", letterSpacing: '0.08em' }}>© 2026</div>
      </footer>

      <style>{`
        @keyframes scrollpulse {
          0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
          50% { opacity: 1; transform: scaleY(1); }
        }
        .ig-feed-scroll {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .ig-feed-scroll::-webkit-scrollbar {
          display: none;
        }
        @media (max-width: 900px) {
          .work-grid { grid-template-columns: 1fr !important; }
          .case-panel-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
          .case-panel-image { order: 1 !important; width: 100%; min-width: 0; max-width: 100%; }
          .case-panel-image > div { max-width: 100%; }
          .case-panel-sticky { position: static !important; transform: none !important; }
          .case-panel-copy { order: 2 !important; min-width: 0; }
          .service-row { grid-template-columns: 48px 1fr !important; gap: 24px !important; padding: 28px 0 !important; }
          .service-row > div:last-child { grid-column: 2 / 3; margin-top: 8px; }
        }
        @media (max-width: 540px) {
          /* Case study panels — tighten padding so mockup matches rest of content width */
          .case-panel-grid { gap: 32px !important; }
          /* Services rows */
          .service-row > div:first-child > div { width: 44px !important; height: 44px !important; font-size: 14px !important; }
        }
      `}</style>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);



</script>


</body></html>
