<style id="client-motion-css">

// ─── Intersection observer hook ───────────────────────────────────────────────
function useReveal(threshold = 0.1, startVisible = false) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(startVisible);
  useEffect(() => {
    if (startVisible) return;
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {setVisible(true);obs.disconnect();}
    }, { threshold, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, [startVisible]);
  return [ref, visible];
}

// ─── prefers-reduced-motion check ─────────────────────────────────────────────
const prefersReducedMotion = () =>
  typeof window !== 'undefined' &&
  window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─── Word-by-word reveal helper ───────────────────────────────────────────────
// Renders `text` split into per-word <span>s with a staggered translate+fade.
// `visible` is driven by the parent's IntersectionObserver. `base` lets a second
// line start later than the first so two-line headings cascade naturally.
function Words({ text, visible, base = 0, step = 55, style }) {
  const reduce = prefersReducedMotion();
  const words = text.split(' ');
  return words.map((w, i) =>
    <React.Fragment key={i}>
      <span style={{
        display: 'inline-block',
        opacity: visible ? 1 : 0,
        transform: visible ? 'translateY(0)' : 'translateY(0.45em)',
        transition: reduce ? 'none' : 'opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1)',
        transitionDelay: reduce ? '0ms' : `${base + i * step}ms`,
        willChange: 'transform, opacity',
        ...style
      }}>{w}</span>
      {i < words.length - 1 && ' '}
    </React.Fragment>
  );
}

// ─── Scroll-driven word color fill ────────────────────────────────────────────
// Each word transitions from `dimColor` → `fullColor` as the heading scrolls
// from `fillRange[0]` × viewport-height to `fillRange[1]` × viewport-height
// (measured from the top of the viewport). Tighter range = punchier moment.
function ScrollFillWords({ text, dimColor, fullColor, fillRange = [0.7, 0.3] }) {
  const ref = useRef(null);
  const [progress, setProgress] = useState(() => (prefersReducedMotion() ? 1 : 0));
  const words = text.split(' ');

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el) return;
    let raf = null;
    const update = () => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || 1;
      const startY = vh * fillRange[0];
      const endY = vh * fillRange[1];
      const p = (startY - rect.top) / (startY - endY);
      setProgress(Math.max(0, Math.min(1, p)));
    };
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { update(); raf = null; });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
    return () => {
      window.removeEventListener('scroll', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [fillRange[0], fillRange[1]]);

  return (
    <span ref={ref}>
      {words.map((w, i) => {
        const threshold = words.length > 1 ? i / (words.length - 1) : 0;
        const filled = progress >= threshold;
        return (
          <React.Fragment key={i}>
            <span style={{
              color: filled ? fullColor : dimColor,
              transition: 'color 0.45s cubic-bezier(0.22, 1, 0.36, 1)'
            }}>{w}</span>
            {i < words.length - 1 && ' '}
          </React.Fragment>
        );
      })}
    </span>
  );
}

// ─── Magnetic button wrapper ──────────────────────────────────────────────────
// Outer span = stable position anchor (its rect drives the cursor distance math).
// Inner span = magnetic translate (the part that visibly drifts toward cursor).
// Inner <a> keeps .btn-pill:hover transform intact — both transforms compose.
function MagneticButton({ href, className, children, strength = 0.28, radius = 110, sketch = null }) {
  const wrapRef = useRef(null);
  const innerRef = useRef(null);
  const aRef = useRef(null);

  // drawably: `sketch={{ variant, seed }}` swaps the CSS pill for a pen-drawn one
  useEffect(() => {
    if (!sketch || !window.drawably || !aRef.current) return;
    const h = window.drawably.drawablyButton(aRef.current, sketch);
    return () => h.destroy();
  }, [sketch && sketch.variant, sketch && sketch.seed]);

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const wrap = wrapRef.current;
    const inner = innerRef.current;
    if (!wrap || !inner) return;

    let raf = null;
    let lastX = 0, lastY = 0;

    const onMove = (e) => {
      const rect = wrap.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const inRange = dist < radius;
      const tx = inRange ? dx * strength : 0;
      const ty = inRange ? dy * strength : 0;
      if (Math.abs(tx - lastX) < 0.4 && Math.abs(ty - lastY) < 0.4) return;
      lastX = tx; lastY = ty;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        inner.style.transform = `translate(${tx}px, ${ty}px)`;
      });
    };

    document.addEventListener('mousemove', onMove);
    return () => {
      document.removeEventListener('mousemove', onMove);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [strength, radius]);

  return (
    <span ref={wrapRef} style={{ display: 'inline-block' }}>
      <span ref={innerRef} style={{
        display: 'inline-block',
        transition: 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)',
        willChange: 'transform'
      }}>
        <a ref={aRef} href={href} className={className}>{children}</a>
      </span>
    </span>
  );
}

  return (
    <div className={cls}>
      <div className="marquee-track">
        {doubled.map((t, i) => <span key={i}>{t}</span>)}
      </div>
    </div>
  );
}

function AdLightbox({ children, onClose }) {
  useEffect(() => {
    const handler = (e) => {if (e.key === 'Escape') onClose();};
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 2000,
      background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(8px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{ position: 'relative', width: '100%', maxWidth: 480 }}>
        {children}
        <button onClick={onClose} style={{

  const onScroll = () => {
    if (!scrollRef.current) return;
    const w = scrollRef.current.clientWidth;
    const idx = Math.round(scrollRef.current.scrollLeft / w);
    if (idx !== activeIdx) setActiveIdx(idx);
  };

  const goto = (i) => {
    if (!scrollRef.current) return;
    scrollRef.current.scrollTo({ left: i * scrollRef.current.clientWidth, behavior: 'smooth' });
  };

  return (
    <div>
      <div style={{
        position: 'relative',
        background: '#fff',
        borderRadius: 6,
        overflow: 'hidden',
        boxShadow: '0 30px 80px rgba(14,13,10,0.18), 0 4px 12px rgba(14,13,10,0.06)'
      }}>
        <div ref={scrollRef} onScroll={onScroll} className="ig-feed-scroll" style={{
          display: 'flex',
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          WebkitOverflowScrolling: 'touch'
        }}>
          {items.map((item, i) => renderItem(item, i, items.length))}
        </div>
      </div>

      {/* Pagination */}
      <div style={{
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: 8, marginTop: 18,
        fontFamily: "'Google Sans',sans-serif"
      }}>
        <button onClick={() => goto(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === 0 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === 0 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === 0 ? 0.4 : 1
        }}>‹</button>
        <div style={{ display: 'flex', gap: 6 }}>
          {items.map((_, i) =>
            <button key={i} onClick={() => goto(i)} style={{
              width: 7, height: 7, borderRadius: '50%',
              background: i === activeIdx ? accent : 'var(--hair-strong, rgba(0,0,0,0.2))',
              border: 'none', padding: 0, cursor: 'pointer',
              transition: 'background 0.2s, transform 0.2s',
              transform: i === activeIdx ? 'scale(1.2)' : 'scale(1)'
            }} />
          )}
        </div>
        <button onClick={() => goto(Math.min(items.length - 1, activeIdx + 1))} disabled={activeIdx === items.length - 1} style={{
          background: 'none', border: '1px solid var(--hair)', borderRadius: 999,
          width: 32, height: 32,
          color: activeIdx === items.length - 1 ? 'var(--ink-dim)' : 'var(--ink)',
          cursor: activeIdx === items.length - 1 ? 'default' : 'pointer',
          fontSize: 14,
          opacity: activeIdx === items.length - 1 ? 0.4 : 1
        }}>›</button>
        <div style={{ marginLeft: 8, fontSize: 11, color: 'var(--ink-dim)', letterSpacing: '0.08em', fontFamily: "'Google Sans',sans-serif" }}>
          {String(activeIdx + 1).padStart(2, '0')} / {String(items.length).padStart(2, '0')}
        </div>
      </div>
    </div>);

}

// ─── Case Study Panel (long-scroll format) ────────────────────────────────────
function CaseStudyPanel({ project, accent, index = 0, side = 'image-left' }) {
  const sectionRef = useRef(null);
  const [visible, setVisible] = useState(false);
  const [progress, setProgress] = useState(0);
  const isImageLeft = side === 'image-left';
  const sectionBg = index % 2 === 0 ? 'var(--bg)' : 'var(--bg2)';
  const headlineMetric = project.metricLabel.split(',')[0];

  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);

    if (prefersReducedMotion()) return () => obs.disconnect();

    let raf = null;
    const update = () => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || 1;
      // 0 when section's top hits viewport bottom, 1 when section's bottom passes viewport top.
      const total = rect.height + vh;
      const seen = vh - rect.top;
      setProgress(Math.max(0, Math.min(1, seen / total)));
    };
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { update(); raf = null; });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
    return () => {
      obs.disconnect();
      window.removeEventListener('scroll', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Subtle scrub: image breathes in slightly as the section passes through view.
  const scrubScale = 1 + progress * 0.04;
  const scrubLift = -progress * 12;

  return (
    <section ref={sectionRef} style={{
      padding: '120px 8vw',
      background: sectionBg,
      borderTop: '1px solid var(--hair)',
      transition: 'opacity 0.9s',
      opacity: visible ? 1 : 0
    }}>
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(2, minmax(0, 1fr))',
        gap: 80,
        alignItems: 'start',
        maxWidth: 1280,
        margin: '0 auto'
      }} className="case-panel-grid">
        {/* Hero creative — sticky-pinned while the copy column scrolls past */}
        <div style={{ order: isImageLeft ? 1 : 2 }} className="case-panel-image">
          <div className="case-panel-sticky" style={{
            position: 'sticky',
            top: 'clamp(88px, 12vh, 140px)',
            transform: `scale(${scrubScale}) translateY(${scrubLift}px)`,
            transformOrigin: 'center center',
            willChange: 'transform'
          }}>
          <MockupFeed
            items={project.creatives}
            accent={accent}
            renderItem={(c, i, total) => {
              const dayLabel = c.day !== undefined ? `Day ${c.day}` : null;
              if (c.kind === 'photo' || c.kind === 'carousel') {
                return <InstagramPost key={i} creative={c} brand={project.client} accent={accent} />;
              }
              if (c.kind === 'sms') {
                return <SMSPost key={i} creative={c} brand={project.client} accent={accent} index={i} total={total} dayLabel={dayLabel} />;
              }
              return <EmailPost key={i} creative={c} brand={project.client} accent={accent} index={i} total={total} dayLabel={dayLabel} />;
            }}
          />
          </div>
        </div>

        {/* Copy */}
        <div style={{ order: isImageLeft ? 2 : 1 }} className="case-panel-copy">
          <div style={{ fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: accent, marginBottom: 24, fontFamily: "'Google Sans',sans-serif", fontWeight: 500 }}>
            Case {String(index + 1).padStart(2, '0')} · {project.type}
          </div>

          <h3 style={{
            fontFamily: 'var(--display)',
            fontSize: 'clamp(48px,6vw,84px)',
            fontWeight: 400,
            color: 'var(--ink)',
            lineHeight: 1,
            letterSpacing: '-0.02em',
            marginBottom: 16
          }}>
            {project.metric}<br />
            <span style={{ color: accent, fontStyle: 'italic', fontWeight: 700, fontSize: '0.55em', display: 'inline-block', marginTop: 8 }}>
              {headlineMetric}
            </span>
          </h3>

          <div style={{
            fontFamily: "'Google Sans',sans-serif",
            fontSize: 22,
            color: 'var(--ink-soft)',
            marginBottom: 36,
            fontStyle: 'italic'
          }}>
            for {project.client}
          </div>

          <div style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 10, fontFamily: "'Google Sans',sans-serif" }}>The Goal</div>
            <p style={{ fontSize: 16, lineHeight: 1.65, color: 'var(--ink)', fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)' }}>
              {project.goal}
            </p>
          </div>

          <div style={{ marginBottom: 36 }}>
            <div style={{ fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 10, fontFamily: "'Google Sans',sans-serif" }}>The Approach</div>
            <p style={{ fontSize: 16, lineHeight: 1.65, color: 'var(--ink)', fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)' }}>
              {project.approach}
            </p>
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: `repeat(${project.results.length},1fr)`,
            gap: 24,
            padding: '24px 0',
            borderTop: '1px solid var(--hair)',
            borderBottom: '1px solid var(--hair)',
            marginBottom: 32
          }}>
            {project.results.map((r, i) =>
              <div key={i}>
                <div style={{ fontFamily: "'Google Sans',sans-serif", fontSize: 28, fontWeight: 900, color: accent, lineHeight: 1 }}>{r.val}</div>
                <div style={{ fontSize: 10, color: 'var(--ink-dim)', marginTop: 8, letterSpacing: '0.06em', textTransform: 'uppercase', fontFamily: "'Google Sans',sans-serif", lineHeight: 1.4 }}>{r.label}</div>
              </div>
            )}
          </div>

          <a href="#contact" style={{
            display: 'inline-flex',
            alignItems: 'center',
            gap: 10,
            fontSize: 12,
            letterSpacing: '0.14em',
            textTransform: 'uppercase',
            color: accent,
            textDecoration: 'none',
            fontFamily: "'Google Sans',sans-serif",
            fontWeight: 600,
            borderBottom: `1px solid ${accent}`,
            paddingBottom: 4
          }}>
            Want this for your studio? <span>→</span>
          </a>
        </div>
      </div>
    </section>);

}

function Nav({ accent }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <nav className="site-nav" style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      padding: '20px 48px',
      background: scrolled ? 'rgba(234,230,220,0.88)' : 'transparent',
      backdropFilter: scrolled ? 'blur(12px) saturate(1.2)' : 'none',
      borderBottom: scrolled ? '1px solid var(--hair)' : '1px solid transparent',
      transition: 'background 0.4s, border-color 0.4s, backdrop-filter 0.4s',
      display: 'flex', justifyContent: 'space-between', alignItems: 'center'
    }}>
      <div style={{ fontFamily: "'Google Sans',sans-serif", fontSize: 18, fontWeight: 700, color: scrolled ? 'var(--ink)' : '#FBF6E8', letterSpacing: '-0.01em', transition: 'color 0.4s' }}>Nick Glenny

      </div>
      <div className="site-nav-links" style={{ display: 'flex', gap: 32, alignItems: 'center' }}>
        {['Work', 'Pricing', 'About', 'Contact'].map((item) => {
          const restColor = scrolled ? 'var(--ink-dim)' : 'rgba(251,246,232,0.82)';
          return (
            <a key={item} href={item === 'Pricing' ? 'pricing.html' : `#${item.toLowerCase()}`} style={{ fontSize: 12, color: restColor, textDecoration: 'none', letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: "'Google Sans',sans-serif", transition: 'color 0.2s' }}
              onMouseEnter={(e) => e.target.style.color = accent}
              onMouseLeave={(e) => e.target.style.color = restColor}>
              {item}
            </a>
          );
        })}
      </div>
    </nav>);

}

/* Phone mockup with a reel inside. Autoplays muted when on screen; tap toggles sound. */
const IS_TOUCH = () => window.matchMedia('(pointer: coarse)').matches;

// Shared focus handling supports a media viewer nested inside a client sheet.
const MODAL_STACK = [];
function useModalFocus(ref) {
  useEffect(() => {
    const dialog = ref.current;
    if (!dialog) return;
    const opener = document.activeElement;
    const disabled = [];
    let branch = dialog;
    while (branch.parentElement) {
      for (const sibling of branch.parentElement.children) {
        if (sibling !== branch && sibling instanceof HTMLElement) {
          disabled.push([sibling, sibling.inert]);
          sibling.inert = true;
        }
      }
      branch = branch.parentElement;
      if (branch === document.body) break;
    }
    MODAL_STACK.push(dialog);
    const isTop = () => MODAL_STACK[MODAL_STACK.length - 1] === dialog;
    const controls = () => [...dialog.querySelectorAll('button, a[href], input, select, textarea, summary, [tabindex]')]
      .filter(el => el.tabIndex >= 0 && !el.disabled && !el.closest('[inert]') && el.getClientRects().length && el.checkVisibility({ checkVisibilityCSS: true }) && (!el.closest('details:not([open])') || el.closest('summary')?.parentElement === el.closest('details:not([open])')));
    const focusFirst = () => (controls()[0] || dialog).focus({ preventScroll: true });
    focusFirst();
    const onKey = event => {
      if (!isTop() || event.key !== 'Tab') return;
      const list = controls();
      const first = list[0], last = list[list.length - 1];
      if (!first) { event.preventDefault(); dialog.focus(); return; }
      if (event.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || document.activeElement === dialog)) {
        event.preventDefault(); first.focus();
      }
    };
    const onFocus = event => {
      if (isTop() && !dialog.contains(event.target)) focusFirst();
    };
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('focusin', onFocus);
    return () => {
      document.removeEventListener('keydown', onKey, true);
      document.removeEventListener('focusin', onFocus);
      const index = MODAL_STACK.indexOf(dialog);
      if (index !== -1) MODAL_STACK.splice(index, 1);
      disabled.forEach(([element, wasInert]) => { element.inert = wasInert; });
      requestAnimationFrame(() => {
        if (opener instanceof HTMLElement && opener.isConnected && !opener.closest('[inert]')) opener.focus({ preventScroll: true });
        else {
          const parent = MODAL_STACK[MODAL_STACK.length - 1];
          if (parent) (parent.querySelector('button') || parent).focus({ preventScroll: true });
        }
      });
    };
  }, []);
}

let OVERLAY_SEQ = 0;
// Push a history entry so the phone's back gesture closes the overlay; returns {close, cleanup}.
function useOverlayHistory(onClose) {
  const id = useRef(null); if (id.current == null) id.current = ++OVERLAY_SEQ;
  const closed = useRef(false);
  useEffect(() => {
    const mounted = performance.now();
    history.pushState({ overlay: id.current }, '');
    const onPop = () => {
      // A history.back() from a previous overlay's close can land after this one mounted; ignore that stale pop.
      if (closed.current || performance.now() - mounted < 600) return;
      closed.current = true; onClose();
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  return () => {
    if (closed.current) return; closed.current = true;
    onClose();
    if (history.state && history.state.overlay === id.current) history.back();
  };
}

function ReelOverlay({ item, onClose }) {
  const dialogRef = useRef(null);
  useModalFocus(dialogRef);
  const vidRef = useRef(null);
  const [paused, setPaused] = useState(false);
  const startY = useRef(null);
  const close = useOverlayHistory(onClose);
  useEffect(() => {
    const v = vidRef.current;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    if (v) { v.muted = false; v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); }); }
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, []);
  const togglePlay = () => { const v = vidRef.current; if (!v) return; if (v.paused) { v.play(); setPaused(false); } else { v.pause(); setPaused(true); } };
  return (
    <div ref={dialogRef} tabIndex={-1} className="reel-overlay" aria-modal="true" role="dialog" aria-label={item.title} onClick={(e) => { if (e.target === e.currentTarget) close(); }}
      onTouchStart={(e) => { startY.current = e.touches[0].clientY; }}
      onTouchEnd={(e) => { if (startY.current != null && e.changedTouches[0].clientY - startY.current > 90) close(); startY.current = null; }}>
      <div className="reel-stage" onClick={(e) => { if (e.target === e.currentTarget) close(); }}>
        <video ref={vidRef} src={item.src} poster={item.poster} playsInline loop onClick={togglePlay} />
      </div>
      {paused && <div className="reel-paused" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>}
      <button type="button" className="reel-close" onClick={close} aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div className="reel-cap">
        <span className="reel-client">{item.client}</span>
        <span className="reel-title">{item.title}</span>
      </div>
    </div>
  );
}

function PhoneReel({ item, onOpen }) {
  const vidRef = useRef(null);
  const [sound, setSound] = useState(false);
  useEffect(() => {
    const v = vidRef.current;
    if (!v) return;
    v.muted = true;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else { v.pause(); }
    }, { threshold: 0.35 });
    obs.observe(v);
    return () => obs.disconnect();
  }, []);
  const open = () => {
    const v = vidRef.current; if (!v) return;
    if (onOpen) { v.pause(); v.muted = true; setSound(false); onOpen(item); return; }
    toggle();
  };
  const toggle = (e) => {
    if (e) e.stopPropagation();
    const v = vidRef.current; if (!v) return;
    const next = !sound; v.muted = !next; setSound(next);
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  };
  return (
    <div className="phone-wrap">
      <div className="phone" role="button" tabIndex={0} onClick={(e) => { e.currentTarget.focus({ preventScroll: true }); open(); }} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }} aria-label={'Open ' + item.title}>
        <div className="phone-screen">
          <video ref={vidRef} src={item.src} poster={item.poster} preload="metadata" loop playsInline />
          <div className="phone-notch" aria-hidden="true"></div>
          <button type="button" className={'phone-sound' + (sound ? ' is-on' : '')} onClick={toggle} aria-label={(sound ? 'Mute ' : 'Unmute ') + item.title}>
            {sound
              ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
              : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>}
          </button>
        </div>
      </div>
      <div className="wt-cap">
        <span className="wt-client">{item.client}</span>
        <span className="wt-title">{item.title}</span>
        <span className="wt-kind">Reel</span>
      </div>
    </div>
  );
}

function ImageOverlay({ items, index, onClose }) {
  const dialogRef = useRef(null);
  useModalFocus(dialogRef);
  // A tile with `slides` opens as its own carousel (i indexes the slides); otherwise i pages through the grid.
  const carousel = !!(items[index] && items[index].slides);
  const [i, setI] = useState(carousel ? 0 : index);
  const start = useRef(null);
  const total = carousel ? items[index].slides.length : items.length;
  const cap = carousel ? items[index] : items[i];
  const src = carousel ? items[index].slides[i] : cap.src;
  const item = cap;
  const close = useOverlayHistory(onClose);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') setI((n) => Math.min(n + 1, total - 1)); if (e.key === 'ArrowLeft') setI((n) => Math.max(n - 1, 0)); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div ref={dialogRef} tabIndex={-1} className="img-overlay" aria-modal="true" role="dialog" aria-label={item.title} onClick={(e) => { if (e.target === e.currentTarget) close(); }}
      onTouchStart={(e) => { start.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }}
      onTouchEnd={(e) => {
        if (!start.current) return;
        const dx = e.changedTouches[0].clientX - start.current.x, dy = e.changedTouches[0].clientY - start.current.y; start.current = null;
        if (Math.abs(dx) > Math.abs(dy)) { if (dx < -50) setI((n) => Math.min(n + 1, total - 1)); else if (dx > 50) setI((n) => Math.max(n - 1, 0)); }
        else if (dy > 90) close();
      }}>
      <img key={src} src={src} alt={cap.client + ' — ' + cap.title + (carousel ? ', slide ' + (i + 1) : '')} />
      {total > 1 && i > 0 && <button type="button" className="img-nav prev" onClick={() => setI((n) => Math.max(n - 1, 0))} aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>}
      {total > 1 && i < total - 1 && <button type="button" className="img-nav next" onClick={() => setI((n) => Math.min(n + 1, total - 1))} aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>}
      <button type="button" className="reel-close" onClick={close} aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div className="reel-cap">
        <span className="reel-client">{cap.client}</span>
        {!(cap.title || '').startsWith(cap.client) && <span className="reel-title">{cap.title}</span>}
      </div>
      {total > 1 && <div className="img-count" aria-hidden="true">{i + 1} / {total}</div>}
      {carousel && <div className="img-dots" aria-hidden="true">{Array.from({ length: total }, (_, n) => <i key={n} className={n === i ? 'on' : ''} />)}</div>}
    </div>
  );
}

function MediaTile({ item, onOpen, showCaption = true }) {
  const inner = (
    <>
      <div className="wt-frame" style={{ aspectRatio: item.ratio }}>
        <img className="wt-media" src={item.src} alt={item.client + ' — ' + item.title} loading="lazy" />
        {item.kind === 'case' && <div className="wt-case-tag">View case study <span>→</span></div>}
        {item.slides && <div className="wt-stack" aria-label={item.slides.length + ' slides'}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></div>}
      </div>
      {showCaption && <div className="wt-cap">
        <span className="wt-client">{item.client}</span>
        <span className="wt-title">{item.title}</span>
        <span className="wt-kind">{KIND_LABEL[item.kind]}</span>
      </div>}
    </>
  );
  if (item.href) return <a className={'wt wt-' + item.kind} href={item.href}>{inner}</a>;
  const tap = onOpen ? (event) => { event.currentTarget.focus({ preventScroll: true }); onOpen(item); } : undefined;
  return <div className={'wt wt-' + item.kind} onClick={tap} role={onOpen ? 'button' : undefined} tabIndex={onOpen ? 0 : undefined} onKeyDown={onOpen ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(item); } } : undefined}>{inner}</div>;
}

const DRAWABLY_BOIL = 1.4;

/* Tab pill drawn by drawably when it loaded; plain pill otherwise. Fixed seeds keep the sketch stable across re-renders. */
function SketchTab({ on, seed, onClick, children }) {

function CarouselCard({ item, title }) {
  const [current, setCurrent] = useState(0);
  const [open, setOpen] = useState(null);
  const rail = useRef(null);
  const slides = item.slides.map((src, n) => ({ src: n === 0 ? item.src : src, client: item.client, title: title + ', slide ' + (n + 1) }));
  const goTo = n => {
    const el = rail.current;
    el.scrollTo({ left: Math.max(0, Math.min(n, slides.length - 1)) * el.clientWidth, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  };
  return <article className="carousel-card" aria-label={title}>
    <div className="carousel-cover">
      <div ref={rail} className="carousel-rail" role="region" aria-label={title + ' slides'}
        onScroll={() => { const el = rail.current; setCurrent(Math.max(0, Math.min(slides.length - 1, Math.round(el.scrollLeft / el.clientWidth)))); }}
        onKeyDown={e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); goTo(current + (e.key === 'ArrowRight' ? 1 : -1)); } }}>
        {slides.map((slide, n) => <button className="carousel-slide" key={slide.src} type="button" tabIndex={n === current ? 0 : -1} aria-hidden={n !== current} onClick={() => setOpen(n)} aria-label={'Enlarge ' + slide.title}>

      </div>
      <button type="button" className="carousel-arrow prev" onClick={() => goTo(current - 1)} disabled={current === 0} aria-label={'Previous slide in ' + title}>←</button>

    </div>
    <div className="carousel-pagination" role="group" aria-label={title + ' slide navigation'}>
      {slides.map((slide, n) => <button key={slide.src} type="button" aria-label={'Go to slide ' + (n + 1)} aria-current={current === n ? 'true' : undefined} onClick={() => goTo(n)} />)}
    </div>
    <h4>{title}</h4>
    <div className="carousel-card-meta"><span>{item.client}</span><span aria-live="polite">{current + 1} / {slides.length}</span></div>
    {open != null && <ImageOverlay items={slides} index={open} onClose={() => setOpen(null)} />}
  </article>;

const CLIENT_MOTION = new URLSearchParams(window.location.search).get('motion');
const MOTION_OPTIONS = ['quiet', 'iris', 'maximal'];
function TransitionStar() {
  const points = Array.from({ length: 24 }, (_, i) => {
    const angle = i * Math.PI / 12 - Math.PI / 2;
    const radius = i % 2 === 0 ? 49 : 16;
    return `${50 + Math.cos(angle) * radius},${50 + Math.sin(angle) * radius}`;
  }).join(' ');
  return <svg className="transition-star" viewBox="0 0 100 100" aria-hidden="true"><polygon points={points} fill="currentColor" /></svg>;
}
function ClientArrival({ children }) {
  const ref = useRef(null);
  const engaged = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const content = el.querySelector('.client-arrival-content');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let frame = null;
    const clear = () => { content.style.clipPath = 'none'; content.style.opacity = '1'; content.style.translate = 'none'; el.style.isolation = 'auto'; };
    const draw = () => {
      frame = null;
      if (motion.matches || engaged.current) { clear(); return; }
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight;
      // The next client's actual section is the reveal surface. No spacer or pinned title screen.
      const progress = Math.max(0, Math.min(1, (vh * .82 - rect.top) / (vh * .94))); // Start later; finish just beyond the viewport top.
      el.style.isolation = progress >= .995 ? 'auto' : 'isolate';
      const w = el.clientWidth;
      const cy = Math.min(vh * .18, 160);
      el.style.setProperty('--star-y', cy + 'px');
      if (CLIENT_MOTION === 'quiet') {
        content.style.opacity = .45 + progress * .55;
        content.style.translate = `0 ${(1 - progress) * 24}px`;
        el.style.setProperty('--turn', `${progress * 100}deg`);
        if (progress >= .995) clear();
      } else if (progress >= .995) {
        clear();
      } else {
        const radius = 24 + Math.pow(progress, CLIENT_MOTION === 'maximal' ? 4 : 3) * Math.hypot(w / 2, vh) * 3.4;
        const turn = (CLIENT_MOTION === 'maximal' ? progress * 110 : progress * 35) * Math.PI / 180;
        const points = Array.from({ length: 24 }, (_, i) => {
          const angle = i * Math.PI / 12 - Math.PI / 2 + turn;
          const r = radius * (i % 2 === 0 ? 1 : .42);
          return `${w / 2 + Math.cos(angle) * r}px ${cy + Math.sin(angle) * r}px`;
        }).join(',');
        content.style.clipPath = `polygon(${points})`;
      }
      el.querySelectorAll('.arrival-star').forEach((star, i) => {
        star.style.setProperty('--turn', `${progress * 140 + i * 12}deg`);
        star.style.setProperty('--scale', .5 + (i + 1) * .8 + progress * (i + 1) * 2.6);
        star.style.setProperty('--star-opacity', CLIENT_MOTION === 'quiet' ? 1 : (1 - progress) * .7);
      });
    };
    const schedule = () => { if (frame === null) frame = requestAnimationFrame(draw); };
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    motion.addEventListener('change', schedule);
    el.addEventListener('focusin', schedule);
    draw();
    return () => { window.removeEventListener('scroll', schedule); window.removeEventListener('resize', schedule); motion.removeEventListener('change', schedule); el.removeEventListener('focusin', schedule); if (frame !== null) cancelAnimationFrame(frame); };
  }, []);
  if (!MOTION_OPTIONS.includes(CLIENT_MOTION)) return children;
  const engage = () => { engaged.current = true; ref.current.style.isolation = 'auto'; const c = ref.current.querySelector('.client-arrival-content'); c.style.clipPath = 'none'; c.style.opacity = '1'; c.style.translate = 'none'; };
  return <div ref={ref} className={'client-arrival arrival-' + CLIENT_MOTION} onFocusCapture={engage} onClickCapture={engage}>
    <div className="arrival-atmosphere" aria-hidden="true">{Array.from({ length: CLIENT_MOTION === 'maximal' ? 7 : 1 }, (_, i) => <div className="arrival-star" key={i}><TransitionStar /></div>)}</div>
    <div className="client-arrival-content">{children}</div>
  </div>;
}

  if (!MOTION_OPTIONS.includes(CLIENT_MOTION)) return null;
  return <nav className="motion-preview" aria-label="Animation previews"><span>Motion study</span>{[['quiet', '01 Subtle'], ['iris', '02 Bold'], ['maximal', '03 Extra']].map(([mode, label]) => <a key={mode} href={'?motion=' + mode + '#motion-start'} aria-current={CLIENT_MOTION === mode ? 'true' : undefined}>{label}</a>)}<a href="?v=approved#work" aria-label="Close animation preview">×</a></nav>;

  useEffect(() => {
    if (!touch.current) return;
    const obs = new IntersectionObserver(([e]) => setHot(e.isIntersecting), { rootMargin: '-35% 0px -35% 0px' });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  // The reel plays whenever the tile is on screen, on every device; hover only adds the details.
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => setInView(e.isIntersecting), touch.current ? { rootMargin: '-35% 0px -35% 0px' } : { threshold: .5 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  useEffect(() => {
    const v = vid.current;
    if (v) { if (inView || hot) { v.play().catch(() => {}); } else { v.pause(); } }
  }, [inView, hot]);
  useEffect(() => {
    if (!hot || !client.cycle) { setFrame(0); return; }
    const t = setInterval(() => setFrame(f => (f + 1) % client.cycle.length), 1100);
    return () => clearInterval(t);
  }, [hot]);
  const cover = client.cycle ? client.cycle[frame] : client.cover;
  return <div ref={ref} className={'ct' + (client.stack ? ' ct-flat' : '') + (visible ? ' is-visible' : '') + (hot ? ' hot' : '') + (inView || hot ? ' playing' : '')} style={{ transitionDelay: visible ? (n % 3) * 110 + 'ms' : '0ms' }}
    onMouseEnter={() => !touch.current && setHot(true)} onMouseLeave={() => !touch.current && setHot(false)}>
    <button type="button" className="ct-card" onClick={() => onOpen(client.key)} onFocus={() => setHot(true)} onBlur={() => !touch.current && setHot(false)} aria-label={'Open all work for ' + client.name}>
      <div className="ct-frame" style={client.ground ? { background: client.ground } : undefined}>
        {client.stack ? <div className={'ct-stack' + (client.wide ? ' wide' : '')}>{client.stack.map((src, k) => { const mid = (client.stack.length - 1) / 2; return <img key={src} src={src} alt="" style={{ '--x': (k - mid) * (client.wide ? 16 : 30) + '%', '--r': (k - mid) * 6 + 'deg', zIndex: k === client.stack.length - 1 ? 3 : k }} />; })}</div>
          : <img className="ct-cover" src={cover} alt="" style={{ objectPosition: client.coverPos || 'center' }} />}
        {client.video && <video ref={vid} src={client.video} muted loop playsInline preload="metadata" className={ready ? 'ready' : ''} onPlaying={() => setReady(true)} />}
        <div className="ct-shade" />
        <div className="ct-info">
          <div className="ct-num">{String(n + 1).padStart(2, '0')}{count ? ' · ' + count + ' pieces' : ''}</div>
          <div className="ct-name">{client.name}</div>
          <div className="ct-kicker">{client.kicker}</div>
          <div className="ct-more"><div>
            <p className="ct-blurb">{client.blurb}</p>
            <div className="ct-thumbs">{client.thumbs.slice(0, 4).map(src => <img key={src} src={src} alt="" loading="lazy" />)}</div>
            <span className="ct-cta">{touch.current ? 'Tap to see the work' : 'See all work'} <span>→</span></span>
          </div></div>
        </div>
      </div>
    </button>
    <div className="ct-tags">{client.tags.map(t => <span key={t}>{t}</span>)}</div>
  </div>;
}

function projectFromURL() {
  const key = new URLSearchParams(location.hash.slice(1)).get('client');
  return CLIENT_TILES.some(client => client.key === key) ? key : null;
}
function projectURL(key) {
  return location.pathname + location.search + (key ? '#client=' + key : '#work');
}

function ClientSheet({ clientKey, onChange, onClose }) {
  const body = useRef(null);
  useModalFocus(body);
  const i = CLIENT_TILES.findIndex(c => c.key === clientKey);
  const client = CLIENT_TILES[i];
  const next = CLIENT_TILES[(i + 1) % CLIENT_TILES.length];
  const back = onClose;
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.img-overlay, .reel-overlay')) back(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, []);
  useEffect(() => { if (body.current) body.current.scrollTop = 0; }, [clientKey]);
  const Project = client.Project;
  return <div ref={body} tabIndex={-1} className="client-sheet" role="dialog" aria-modal="true" aria-label={client.name + ', all work'}>
    <div className="sheet-bar">
      <button type="button" onClick={back}>← All clients</button>
      <span className="sheet-title">{String(i + 1).padStart(2, '0')} / {client.name}</span>
      <button type="button" onClick={() => onChange(next.key)}>Next: {next.name} →</button>
    </div>
    <div className="sheet-body"><Project key={client.key} /></div>
  </div>;
}

function ClientGrid() {
  const [open, setOpen] = useState(projectFromURL);
  const grid = useRef(null);
  useEffect(() => {
    const initial = projectFromURL();
    // A direct link gets an in-site Back destination without leaving the portfolio.
    if (initial && !history.state?.sheet) {
      history.replaceState(null, '', projectURL(null));
      history.pushState({ sheet: initial }, '', projectURL(initial));
    } else if (initial) {
      history.replaceState({ sheet: initial }, '', projectURL(initial));
    }
    const sync = () => setOpen(projectFromURL());
    window.addEventListener('popstate', sync);
    window.addEventListener('hashchange', sync);
    return () => { window.removeEventListener('popstate', sync); window.removeEventListener('hashchange', sync); };
  }, []);
  const openProject = key => {
    history.pushState({ sheet: key }, '', projectURL(key));
    setOpen(key);
  };
  const changeProject = key => {
    history.replaceState({ sheet: key }, '', projectURL(key));
    setOpen(key);
  };
  const closeProject = () => {
    if (history.state?.sheet) history.back();
    else { history.replaceState(null, '', projectURL(null)); setOpen(null); }
  };
  // Phone feed: the feed only takes swipes once the page has settled it under the nav, so the swipe that
  // arrives at the feed can't carry on and skip The Picklr.
  useEffect(() => {
    const el = grid.current;
    const mq = window.matchMedia('(max-width: 640px)');
    // Keep an entered feed scrollable even if browser chrome or scroll chaining moves the page.
    // Only delay feed scrolling while approaching its first card from above.
    const check = () => el.classList.toggle('docked', !mq.matches || el.getBoundingClientRect().top <= 58 || el.scrollTop > 0);
    check();
    window.addEventListener('scroll', check, { passive: true }); window.addEventListener('resize', check);
    return () => { window.removeEventListener('scroll', check); window.removeEventListener('resize', check); };
  }, []);
  return <>
    <div ref={grid} className="client-grid">{CLIENT_TILES.map((c, n) => <ClientTile key={c.key} client={c} n={n} onOpen={openProject} />)}</div>
    {open && <ClientSheet clientKey={open} onChange={changeProject} onClose={closeProject} />}
  </>;
}

function FeaturedWork() {
  const [tab, setTab] = useState('client');
  useEffect(() => {
    const sync = () => { if (projectFromURL()) setTab('client'); };
    window.addEventListener('hashchange', sync);
    window.addEventListener('popstate', sync);
    return () => { window.removeEventListener('hashchange', sync); window.removeEventListener('popstate', sync); };
  }, []);
  return <div className="portfolio-browser">
    <div className="photo-tabs" role="tablist" aria-label="Work categories" onKeyDown={e => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
        e.preventDefault();
        const next = e.key === 'Home' ? 'client' : e.key === 'End' ? 'portrait' : tab === 'client' ? 'portrait' : 'client';
        setTab(next); e.currentTarget.querySelectorAll('[role="tab"]')[next === 'client' ? 0 : 1].focus();
      }
    }}>
      <SketchTab on={tab === 'client'} seed={31} onClick={() => setTab('client')}>Client work</SketchTab>
      <SketchTab on={tab === 'portrait'} seed={47} onClick={() => setTab('portrait')}>Portraits</SketchTab>

  </div>;
}

  const [contactMessage, setContactMessage] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [contactStatus, setContactStatus] = useState('idle');
  const [contactError, setContactError] = useState('');
  const contactPending = useRef(false);

  async function submitContact(event) {
    event.preventDefault();
    if (contactPending.current) return;
    contactPending.current = true;
    setContactStatus('sending');
    setContactError('');
    try {
      const response = await fetch('https://formspree.io/f/mlgznnpn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          email: contactEmail.trim(),
          ...(contactWebsite.trim() ? { website: contactWebsite.trim() } : {}),
          ...(contactMessage.trim() ? { message: contactMessage.trim() } : {})
        })
      });
      if (!response.ok) {
        const data = await response.json().catch(() => null);
        const messages = data && Array.isArray(data.errors)
          ? data.errors.map(error => error.message).filter(message => typeof message === 'string').join(' ')
          : '';
        setContactError(messages || 'Your details could not be sent. Please try again or email me directly.');
        setContactStatus('error');
        return;
      }
      setSubmitted(true);
      setContactStatus('success');
    } catch (error) {
      setContactError('We could not confirm your submission. Please try again or email me directly.');
      setContactStatus('error');
    } finally {
      contactPending.current = false;
    }
  }

        root.setProperty('--ink-soft', '#4A453B');

    const applyAccent = (c) => {

    // ── Close button ──
    const closeBtn = document.getElementById('panel-close');
    if (closeBtn) closeBtn.addEventListener('click', () => {
      panel.classList.remove('visible');
      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
    });

    // ── Background swatches ──
    panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((s) => {
      s.addEventListener('click', () => {
        panel.querySelectorAll('#bg-swatches .bg-swatch').forEach((x) => x.classList.remove('active'));
        s.classList.add('active');
        const name = s.dataset.bg;
        applyBg(name);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { background: name } }, '*');
      });
    });

    // ── Body weight segmented ──

    // ── Contrast segmented ──

                    width: '100%',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    gap: 24,
                    padding: '28px 0',
                    background: 'transparent',
                    border: 'none',
                    cursor: 'pointer',
                    textAlign: 'left',
                    fontFamily: "'Google Sans',sans-serif",
                    color: 'var(--ink)'
                  }}>
                  <span style={{
                    fontSize: 'clamp(16px,1.5vw,18px)',
                    fontWeight: 500,
                    lineHeight: 1.4,
                    color: isOpen ? accent : 'var(--ink)',
                    transition: 'color 0.25s'
                  }}>{item.q}</span>
                  <span style={{
                    flexShrink: 0,
                    width: 28, height: 28,
                    border: `1px solid ${isOpen ? accent : 'var(--hair)'}`,
                    borderRadius: '50%',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    transition: 'transform 0.3s ease, border-color 0.25s, background 0.25s',
                    transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                    background: isOpen ? accent + '14' : 'transparent'
                  }}>
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <polyline points="1,1 5,5 9,1" stroke={isOpen ? accent : 'var(--ink-dim)'} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  </span>
                </button>
                <div id={'faq-answer-' + i} aria-hidden={!isOpen} style={{
                  maxHeight: isOpen ? 800 : 0,
                  opacity: isOpen ? 1 : 0,
                  overflow: 'hidden',
                  transition: 'max-height 0.4s ease, opacity 0.3s ease'
                }}>
                  <p style={{
                    fontSize: 15,
                    color: 'var(--ink-soft)',
                    lineHeight: 1.75,
                    fontFamily: "'Google Sans',sans-serif",
                    fontWeight: 'var(--body-weight)',
                    padding: '0 0 32px 0',
                    maxWidth: 680,
                    margin: 0
                  }}>{item.a}</p>
                </div>
              </div>);
          })}
        </div>
      </section>

      {/* ── ABOUT ── */}
      <section id="about" style={{ padding: '100px 8vw', background: 'var(--bg2)', borderTop: '1px solid var(--hair)' }}>
        <div ref={aboutRef} className="about-grid" style={{
          display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '80px', alignItems: 'center',
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: aboutVisible ? 1 : 0,
          transform: aboutVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-dim)', marginBottom: 20, fontFamily: "'Google Sans',sans-serif" }}>About</div>
            <h2 style={{ fontFamily: 'var(--display)', fontSize: 'clamp(24px,3vw,42px)', fontWeight: 400, color: 'var(--ink)', lineHeight: 1.15, marginBottom: 28, letterSpacing: '-0.02em' }}>
              <ScrollFillWords
                text="I sold the memberships. I ran the floor."
                dimColor="var(--ink-dim)"
                fullColor="var(--ink)"
              />
              <br />
              <em>
                <ScrollFillWords
                  text="Now I run the marketing."
                  dimColor="var(--ink-dim)"
                  fullColor={accent}
                />
              </em>
            </h2>
            <div style={{ fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.85, fontFamily: "'Google Sans',sans-serif", fontWeight: 'var(--body-weight)', maxWidth: 520 }}>
              <p style={{ marginBottom: 20 }}>
                I'm from Orange County, California, born and raised. My relationship with fitness started in high school as an athlete and shifted when I joined a gym for the first time. I came in to train and stayed for the way it made me feel and the community inside it. Over the years I worked inside Pilates studios, strength gyms, and boutique fitness spaces, doing every job that kept the doors open: selling memberships, cleaning equipment, running the floor, sitting across from members and listening to what they actually wanted. Six years of training, three years of working inside the studios that train other people.
              </p>
              <p style={{ marginBottom: 20 }}>
                Marketing was the next thing to click, but it started with psychology. What pulled me in was the question underneath the buying decision: why someone walks into a class on a Tuesday and signs up, what shifts in them between the first email and the third, what makes a person finally do the thing they've been putting off for two years. I studied computer science for a year, then finished an associate's in business administration. Most of what I know about buyer behavior came from watching it happen on the studio floor, not from a textbook. People's decisions about their bodies are personal, and figuring out why they make them is the part I like.
              </p>
              <p>
                This business is where those two things meet. I started with fitness studios and I still work with them first, but the same approach works for any service business trying to get someone from interested to signed up. If the studio stays full, more people get what I got out of it.
              </p>
            </div>
          </div>
          {/* Portrait + rotating book-a-call mini-badge */}
          <div style={{ position: 'relative', maxWidth: 400 }}>
            <div style={{ aspectRatio: '4/5', background: 'var(--bg3)', borderRadius: 2, position: 'relative', overflow: 'hidden', boxShadow: '0 18px 48px rgba(26,22,18,0.22), 0 2px 6px rgba(26,22,18,0.08)' }}>
              <img src={(window.__resources && window.__resources.portrait) || 'content/about/photos/nick-portrait.png'} alt="Nick Glenny portrait" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            </div>
            <a href="#contact" className="portrait-badge" aria-label="Discuss your project"><MiniBadge /></a>
          </div>
        </div>
      </section>

      {/* ── CONTACT (ink-on-dark) ── */}
      <section id="contact" className="contact-dark" style={{ padding: 'clamp(100px, 14vh, 160px) clamp(20px, 5vw, 56px)' }}>
        <div className="big-badge"><MiniBadge /></div>
        <div ref={contactRef} style={{
          maxWidth: 760, position: 'relative', zIndex: 2,
          transition: 'opacity 0.8s, transform 0.8s',
          opacity: contactVisible ? 1 : 0,
          transform: contactVisible ? 'translateY(0)' : 'translateY(32px)'
        }}>
          <div className="eyebrow-line">04 — Contact</div>
          <h2>
            <Words text="Ready to" visible={contactVisible} />
            <br />
            <em>
              <Words text="get started?" visible={contactVisible} base={280} />
            </em>
          </h2>
          <p className="lede">
            Drop your email and I'll get back to you this week with two specific things I'd change about your marketing, and we can go from there.
          </p>

          {submitted ?
          <div className="contact-confirm" role="status">
            <b>Got it.</b>
            <p>Your details were received. I'll be in touch this week.</p>
          </div> :
          <form onSubmit={submitContact} aria-busy={contactStatus === 'sending'}>
            <div className="contact-context">
              <label htmlFor="contact-website">Website or Instagram <span>(optional)</span></label>
              <input id="contact-website" name="website" type="text" placeholder="Your website or @handle"
                disabled={contactStatus === 'sending'} value={contactWebsite}
                onChange={(e) => setContactWebsite(e.target.value)} />
              <label htmlFor="contact-message">What do you need? <span>(optional)</span></label>
              <textarea id="contact-message" name="message" rows="3" placeholder="A shoot, ongoing content, editing, a website…"
                disabled={contactStatus === 'sending'} value={contactMessage}
                onChange={(e) => setContactMessage(e.target.value)} />
            </div>
            <div className="contact-row">
              <input
                type="email"
                name="email"
                aria-label="Email"
                aria-describedby="contact-status"
                autoComplete="email"
                required
                disabled={contactStatus === 'sending'}
                placeholder="your@email.com"
                value={contactEmail}
                onChange={(e) => setContactEmail(e.target.value)} />
              <button type="submit" disabled={contactStatus === 'sending'}>
                {contactStatus === 'sending' ? 'Sending…' : 'Send my details'} <span aria-hidden="true">→</span>
              </button>
            </div>
            <p id="contact-status" role="status" aria-live="polite" style={{ color: '#FBF6E8', fontSize: 14, maxWidth: 540 }}>
              {contactStatus === 'sending' ? 'Sending your details…' : contactError}
              {contactStatus === 'error' && <> <a href="mailto:nickglenny@gmail.com" style={{ color: 'inherit', textDecoration: 'underline' }}>Email Nick</a></>}
            </p>
          </form>
          }

          <div className="contact-meta">
            <div className="col"><span>Email</span><p>nickglenny@gmail.com</p></div>
            <div className="col"><span>Based</span><p>Orange County, CA<br />Remote nationwide</p></div>
            <div className="col"><span>Response</span><p>Same week</p></div>
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer style={{ padding: '32px 8vw', borderTop: '1px solid var(--hair)', background: 'var(--bg)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ fontFamily: "'Google Sans',sans-serif", fontSize: 15, color: 'var(--ink-dim)' }}>Nick Glenny</div>
        <div style={{ display: 'flex', gap: 28, alignItems: 'center', fontSize: 12, fontFamily: "'Google Sans',sans-serif" }}>
          <a href="#contact" style={{ color: 'var(--ink-soft)', textDecoration: 'none', borderBottom: `1px solid ${accent}55`, paddingBottom: 2 }}>Questions? Discuss your project →</a>
          <a href="mailto:nickglenny@gmail.com" style={{ color: 'var(--ink-dim)', textDecoration: 'none' }}>nickglenny@gmail.com</a>
        </div>
        <div style={{ fontSize: 11, color: 'var(--ink-dim)', fontFamily: "'Google Sans',sans-serif", letterSpacing: '0.08em' }}>© 2026</div>
      </footer>

      <style>{`
        @keyframes scrollpulse {
          0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
          50% { opacity: 1; transform: scaleY(1); }
        }
        .ig-feed-scroll {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .ig-feed-scroll::-webkit-scrollbar {
          display: none;
        }
        @media (max-width: 900px) {
          .work-grid { grid-template-columns: 1fr !important; }
          .case-panel-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
          .case-panel-image { order: 1 !important; width: 100%; min-width: 0; max-width: 100%; }
          .case-panel-image > div { max-width: 100%; }
          .case-panel-sticky { position: static !important; transform: none !important; }
          .case-panel-copy { order: 2 !important; min-width: 0; }
          .service-row { grid-template-columns: 48px 1fr !important; gap: 24px !important; padding: 28px 0 !important; }
          .service-row > div:last-child { grid-column: 2 / 3; margin-top: 8px; }
        }
        @media (max-width: 540px) {
          /* Case study panels — tighten padding so mockup matches rest of content width */
          .case-panel-grid { gap: 32px !important; }
          /* Services rows */
          .service-row > div:first-child > div { width: 44px !important; height: 44px !important; font-size: 14px !important; }
        }
      `}</style>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);



</script>


</body></html>
